<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121315">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>天星界・御劍者 v0.6</title>
<style>
:root{
  --bg:#121315;--panel:#1b1d20;--panel2:#23262a;--line:#34373c;--text:#e9e3d6;--muted:#9a958b;--faint:#6d6961;
  --ver:#c8553d;--ver-d:#7a2f22;--jade:#5fa58f;--jade-d:#2f5a4d;--gold:#c9a45c;--gold-d:#6e5a2f;--bad:#d66a5a;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 32px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.serif{font-family:var(--serif)}
header{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 10px}
header h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.12em}
header h1 small{font-family:var(--sans);font-size:11px;color:var(--faint);letter-spacing:0;margin-left:6px;font-weight:400}
.silver{font-size:14px;color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.seal{display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;border-radius:6px;line-height:1;flex-shrink:0}
.seal.big{width:52px;height:52px;font-size:30px;background:var(--ver);color:#f6eee0;box-shadow:inset 0 0 0 2px #f6eee033}
.seal.mid{width:36px;height:36px;font-size:20px}
.seal.sm{width:24px;height:24px;font-size:14px;border-radius:4px}
.hero{display:flex;gap:12px;align-items:center}
.hero .info{flex:1;min-width:0}
.hero .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .name b{font-family:var(--serif);font-size:16px;font-weight:600}
.hero .name span{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{height:8px;background:#0c0d0e;border-radius:4px;overflow:hidden;margin-top:6px;position:relative}
.bar i{display:block;height:100%;border-radius:4px;transition:width .15s linear}
.bar.hp i{background:var(--ver)} .bar.en i{background:var(--gold)} .bar.exp i{background:var(--jade)}
.bar.flash{animation:flash .25s}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--bad)}100%{box-shadow:0 0 0 0 transparent}}
.barrow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.barrow .bar{flex:1;margin-top:0}
.barrow em{font-style:normal;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.bars{margin-top:8px;display:grid;gap:5px}
.zones{display:flex;gap:6px;margin:10px 0}
.zones button{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;font-family:var(--serif)}
.zones button.on{border-color:var(--jade);background:var(--jade-d);color:#e6f3ee}
.zones button:disabled{opacity:.45;cursor:default}
.zones button small{display:block;font-family:var(--sans);font-size:10px;color:var(--muted);margin-top:1px}
.zones button.on small{color:#b9dccf}
.arena{position:relative;overflow:hidden;padding:0}
.stage{position:relative;height:190px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 85%,#2c3a2f 0%,#1b1d20 62%)}
.stage svg{width:150px;height:150px;filter:drop-shadow(0 6px 10px #0008)}
.stage .mob{transition:transform .08s}
.stage .mob.hit{transform:translateX(4px) rotate(2deg)}
.stage .mob.elite{animation:breathe 2.4s ease-in-out infinite}
.stage .mob.dead{opacity:0;transform:translateY(12px) scale(.88);transition:opacity .7s,transform .7s;animation:none}
@keyframes breathe{50%{transform:scale(1.04)}}
.stage .idle{font-family:var(--serif);color:var(--muted);font-size:15px;letter-spacing:.1em;text-align:center}
.stage .idle small{display:block;font-family:var(--sans);font-size:12px;color:var(--faint);letter-spacing:0;margin-top:6px}
.floaters{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;font-weight:700;font-size:16px;text-shadow:0 2px 4px #000c;animation:up .9s ease-out forwards;white-space:nowrap}
.fl.crit{font-size:22px;color:#ffb199}.fl.counter{color:#8fe0c4}.fl.countered{color:#aaa49a}.fl.skill{font-family:var(--serif)}
@keyframes up{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px)}}
.mobinfo{padding:10px 12px 12px;border-top:1px solid var(--line)}
.mobhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mobhead b{font-family:var(--serif);font-size:16px;font-weight:600}
.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.tag.elite{background:var(--ver-d);color:#ffd9cf}
.stances{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--muted);opacity:.55}
.chip.on{opacity:1;color:var(--text);border-color:var(--text)}
.chip.good .seal{background:var(--jade);color:#0e1f19}.chip.bad .seal{background:var(--bad);color:#2a0e0a}.chip .seal{background:var(--panel2);color:var(--text)}
.match{margin-top:8px;font-size:12px;padding:6px 8px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.match.good{background:#1f3a31;color:#a6e3cd}.match.bad{background:#3d1f1b;color:#ffb9ad}
.log{margin-top:10px;padding:8px 12px;font-size:12px;line-height:1.75;min-height:150px}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.log div:nth-child(1){color:var(--text)}
.log div:nth-child(n+6){opacity:.6}
.log .k-good{color:#8fe0c4}.log .k-bad{color:#ffb199}.log .k-gold{color:var(--gold)}.log .k-lv{color:#f2d58a;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.tabs button{padding:8px 0;border-radius:8px;font-family:var(--serif);font-size:12.5px;color:var(--muted);border:1px solid transparent;position:relative}
.tabs button.on{color:var(--text);border-color:var(--line);background:var(--panel)}
.tabs button .dot{position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:3px;background:var(--ver)}
.panel{margin-top:6px}
.sec{margin-bottom:10px}
.sec h3{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:8px;letter-spacing:.05em}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.statrow{display:grid;grid-template-columns:40px 64px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.statrow:last-child{border-bottom:none}
.statrow b{font-family:var(--serif);font-weight:600}
.stars{color:var(--gold);letter-spacing:-1px;font-size:12px}
.stars i{font-style:normal;color:#3e3a33}
.statrow small{color:var(--faint);font-size:11px}
.statrow em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right}
.wcard{display:flex;gap:12px;align-items:center}
.wcard .meta{font-size:12px;color:var(--muted);line-height:1.7}
.wcard .meta b{font-family:var(--serif);font-size:17px;color:var(--text);font-weight:600}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:4px}
.pill.def{background:#26364a;color:#a9c6ea}.pill.out{background:#4a2a26;color:#f0b6a9}
.cost{display:grid;gap:6px;margin:10px 0}
.costrow{display:flex;align-items:center;gap:8px;font-size:13px}
.costrow .n{margin-left:auto;font-variant-numeric:tabular-nums}
.costrow .n.ok{color:#a6e3cd}.costrow .n.no{color:#ffb199}
.btn{display:block;width:100%;padding:12px;border-radius:10px;background:var(--ver);color:#fff6ea;font-family:var(--serif);font-size:16px;letter-spacing:.15em;font-weight:600}
.btn:disabled{background:var(--panel2);color:var(--faint);cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);letter-spacing:.05em;font-size:14px;font-weight:400}
.btn.warn{background:transparent;border:1px solid var(--ver-d);color:#ffb9ad;letter-spacing:.05em;font-size:14px;font-weight:400}
.epi{font-family:var(--serif);font-size:13px;color:var(--muted);line-height:1.9;border-left:2px solid var(--ver-d);padding-left:10px;margin:4px 0 12px}
.epi cite{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:2px}
.swordlv{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--gold)}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mat{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px}
.mat .seal{background:var(--gold-d);color:#f7e7c2}
.mat b{font-family:var(--serif);font-weight:600;font-size:14px}
.mat div{min-width:0;flex:1}
.mat small{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat em{font-style:normal;font-variant-numeric:tabular-nums;font-size:15px}
.quest .giver{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.quest .giver .seal{background:var(--jade-d);color:#d6efe6}
.quest .giver b{font-family:var(--serif);font-size:15px}
.quest .giver span{font-size:12px;color:var(--muted)}
.quest p{font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:8px}
.wgroups{display:grid;gap:10px}
.wgroup h4{font-family:var(--serif);font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.1em}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:10px;color:var(--muted)}
.wt .seal{width:30px;height:30px;font-size:18px;background:#3a3d42;color:var(--text)}
.wt.def .seal{background:#26364a;color:#cfe0f5}.wt.out .seal{background:#4a2a26;color:#f7d0c6}
.wt.cur{border-color:var(--gold)} .wt.sel{outline:2px solid var(--text);outline-offset:1px}
.wt.todo{border-style:dashed;opacity:.5}
.wt.todo .seal{background:transparent;border:1px dashed var(--faint);color:var(--faint)}
.wdetail{margin-top:10px}
.note{font-size:12px;color:var(--faint);line-height:1.7}
textarea{width:100%;height:80px;background:#0c0d0e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;font-family:ui-monospace,monospace}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{width:100%;max-width:420px;max-height:85vh;overflow:auto;padding:18px}
.modal h2{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.1em;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.big{font-family:var(--serif);font-size:22px;color:#f2d58a;margin:4px 0 10px}
.loc{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.loc .where{flex:1;min-width:0}
.loc .where small{display:block;font-size:11px;color:var(--muted)}
.loc .where b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em}
.loc .where em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.loc button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--serif);font-size:14px;background:var(--panel2)}
.chaps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px}
.chaps button{padding:6px 0;border-radius:8px;border:1px solid var(--line);font-family:var(--serif);font-size:13px;line-height:1.3;color:var(--muted)}
.chaps button small{display:block;font-size:10px;font-family:var(--sans)}
.chaps button.on{border-color:var(--gold);color:var(--text);background:var(--panel2)}
.chaps button.lock{opacity:.55}
.place{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.place.cur{border-color:var(--jade)}
.place .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.place .ph b{font-family:var(--serif);font-size:15px;font-weight:600}
.place .ph span{font-size:11px;color:var(--muted)}
.place .subs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.place .subs button{padding:6px 2px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:12px;line-height:1.35}
.place .subs button small{display:block;font-size:10px;color:var(--muted)}
.place .subs button.on{border-color:var(--jade);background:var(--jade-d);color:#e6f3ee}
.place .subs button.on small{color:#b9dccf}
.place .subs button:disabled{opacity:.4;cursor:default}
.place.locked{opacity:.5}
.place .rare{font-size:10px;color:#ffb9ad;margin-left:4px}
.lockplaces{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lockplaces span{font-family:var(--serif);font-size:13px;padding:4px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0 10px}
.toggle input{width:40px;height:22px;accent-color:var(--jade)}
.npc{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.npc.locked{border-style:dashed;opacity:.7}
.tag.boss{background:#5a4a1a;color:#ffe9a8}
.pthead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.pthead span{font-size:13px;color:var(--muted)} .pthead b{color:var(--gold);font-size:17px;font-family:var(--serif)}
.statrow2{display:grid;grid-template-columns:36px 58px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.statrow2 b{font-family:var(--serif);font-weight:600}
.sv em{font-style:normal;font-variant-numeric:tabular-nums;font-size:14px;display:block}
.sv em.up{color:#a6e3cd}
.sv small{display:block;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.pm{display:flex;align-items:center;gap:4px}
.pm button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:17px;line-height:1}
.pm button:disabled{opacity:.25;cursor:default}
.pm span{min-width:20px;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
.ptbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.ptbar .btn{font-size:14px;letter-spacing:.03em;padding:10px 6px;font-weight:400}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px;color:var(--faint);margin-top:8px}
.kv .up{color:#a6e3cd}
.skill{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.skill.lock{opacity:.5;border-style:dashed}
.skill .sh{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.skill .sh b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em}
.skill .sh .lvreq{margin-left:auto;font-size:11px;color:var(--muted)}
.pill.act{background:#4a2a26;color:#f0b6a9}.pill.pas{background:#26364a;color:#a9c6ea}.pill.trg{background:#3a3220;color:#f2d58a}
.skill .sm{font-size:11px;color:var(--muted);margin-bottom:6px}
.skill .sd{font-size:13px;line-height:1.75}
.skill .sd .mx{color:var(--faint);font-size:11px;margin-left:1px}
.skill .sf{font-family:var(--serif);font-size:12.5px;color:var(--faint);margin-top:6px;letter-spacing:.03em}
.skill .barrow{margin-top:8px}
.wskills{margin-top:8px;font-size:12px;line-height:1.7;color:var(--muted)}
.wskills b{font-family:var(--serif);color:var(--text);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chips:empty{display:none}
.chips span{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);font-variant-numeric:tabular-nums}
.chips span.buff{background:#3a3220;color:#f2d58a}
.chips span.low{background:#3d1f1b;color:#ffb9ad}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.subtabs button{padding:8px;border-radius:8px;border:1px solid var(--line);font-family:var(--serif);font-size:14px;color:var(--muted)}
.subtabs button.on{border-color:var(--gold);color:var(--text);background:var(--panel2)}
.itemrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.itemrow:last-child{border-bottom:none}
.itemrow .seal{width:34px;height:34px;font-size:18px;background:#4a2a26;color:#f7d0c6}
.itemrow .seal.bf{background:#3a3220;color:#f2d58a}
.itemrow .seal.en{background:#26364a;color:#cfe0f5}
.itemrow b{font-family:var(--serif);font-size:15px;font-weight:600}
.itemrow b em{font-family:var(--sans);font-style:normal;font-size:12px;color:var(--gold);margin-left:6px;font-weight:400}
.itemrow small{display:block;font-size:11px;color:var(--muted);line-height:1.6}
.itemrow .ctl{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.itemrow .ctl button{padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:12px;white-space:nowrap}
.itemrow .ctl button:disabled{opacity:.35;cursor:default}
.itemrow .ctl label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.itemrow .ctl input{accent-color:var(--jade);width:16px;height:16px}
.reccost{font-size:11px;line-height:1.6}
.reccost .ok{color:#a6e3cd}.reccost .no{color:#ffb9ad}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px}
.req .giver .seal{background:var(--gold-d);color:#f7e7c2}
.stage{height:205px}
.mobs{display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%;padding:14px 8px 0}
.mobc{position:relative;display:flex;flex-direction:column;align-items:center;flex:1;max-width:170px;transition:opacity .7s,transform .7s}
.mobc .mob svg{width:100%;height:100%}
.mobc .mlabel{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.mobc .mlabel .seal{width:18px;height:18px;font-size:11px;border-radius:4px;background:var(--panel2);color:var(--text)}
.mobc .mlabel .seal.good{background:var(--jade);color:#0e1f19}.mobc .mlabel .seal.bad{background:var(--bad);color:#2a0e0a}
.mobc .bar.mini{height:4px;width:78%;margin-top:3px}
.mobc.tgt .mlabel .nm{color:var(--text)}
.mobc.tgt::before{content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--gold)}
.mobc.dead{opacity:0;transform:translateY(12px) scale(.9)}
.mobc .floaters{position:absolute;inset:0;pointer-events:none}
.chip.solo{padding:3px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;transition:opacity .3s}
</style>
</head>
<body>
<div class="wrap">

/* ---------- 工具 ---------- */
let rng = Math.random;
function setRng(f) { rng = f; }
const randInt = (a, b) => a + Math.floor(rng() * (b - a + 1));

/* ---------- 四氏輪迴 ---------- */
function posOf(ch) {
  for (let g = 0; g < 4; g++) { const p = GAME.groups[g].members.indexOf(ch); if (p >= 0) return { g, p }; }
  return null;
}
function counters(a, b) { // a 剋 b
  const A = posOf(a), B = posOf(b);
  return !!(A && B && B.g === (A.g + 1) % 4 && B.p === (A.p + 1) % 5);
}
function matchup(att, def) {
  if (counters(att, def)) return 'counter';
  if (counters(def, att)) return 'countered';
  return 'neutral';
}
function counterTargets(ch) {
  const A = posOf(ch);
  return {
    beats: GAME.groups[(A.g + 1) % 4].members[(A.p + 1) % 5],
    beatenBy: GAME.groups[(A.g + 3) % 4].members[(A.p + 4) % 5]
  };
}
function groupOf(ch) { return GAME.groups[posOf(ch).g].name; }
function rollMult(kind, crit) {
  const r = GAME.multipliers[crit ? kind + 'Crit' : kind];
  return r[0] + rng() * (r[1] - r[0]);
}

/* ---------- 角色 ---------- */
function expNeed(lv) { return Math.round(GAME.rules.expBase * Math.pow(lv, GAME.rules.expPow)); }

function derive(st) {
  const w = GAME.weapons[st.weapon];
  const al = allocOf(st, st.weapon);
  const base = w.stars.map(x => x * (st.lv + 4));
  const bonus = w.stars.map((x, i) => round3(al[i] * GAME.points.exact(x))); // 先用精確值相乘，結果再取小數三位
  const s = base.map((b, i) => round3(b + bonus[i]));
  const [STR, BLK, VIT, AGI, INT, GRD, SPI, CTL] = s;
  const sw = st.swordLv[st.weapon] || 0;
  const magic = INT > STR; // 同分算物理
  const main = magic ? INT : STR;
  const castSpeed = magic ? 1 + AGI * 0.004 : 1;
  const d = {
    stats: s, base, bonus, magic, main,
    atk: Math.round((main * 2 + 10) * (1 + GAME.sword.atkPerLv * sw)),
    crit: Math.min(0.6, 0.05 + main * 0.0015),
    pdef: BLK * 2, mdef: GRD * 2,
    ptough: Math.min(0.3, BLK * 0.001), mtough: Math.min(0.3, GRD * 0.001),
    maxHp: Math.round((VIT * 12 + 60) * (1 + GAME.sword.hpPerLv * sw)),
    maxEn: (magic ? SPI : VIT) + 20,
    enName: magic ? '靈氣' : '氣力',
    hit: Math.min(1, 0.9 + AGI * 0.002),
    cdr: Math.min(0.4, AGI * 0.005),
    castSpeed,
    heal: SPI * 0.01,
    stun: Math.min(0.5, CTL * 0.003),
    resist: Math.min(0.8, CTL * 0.005),
    interval: GAME.rules.baseInterval / castSpeed,
    skillName: st.weapon + '・初式'
  };
  const B = st.buffs || {}, bv = k => (B[k] ? GAME.items[B[k].item].v : 0);
  d.atkBuff = bv('atk'); d.expBuff = bv('exp'); d.dropBuff = bv('drop');
  applySkills(st, d, sw);
  if (d.atkBuff) d.atk = Math.round(d.atk * (1 + d.atkBuff));
  if (bv('crit')) d.crit = Math.min(0.7, d.crit + bv('crit'));
  if (bv('dr')) d.drs.push({ v: bv('dr'), when: 'always' });
  return d;
}

function newState() {

// 舊存檔升級：v0.1 的息區狩獵區已移到第五章
function migrate(st) {
  if (!zoneById(st.zone)) st.zone = bestZone(st).id;
  if (st.auto === undefined) st.auto = true;
  if (!st.alloc) st.alloc = {};
  if (!st.resetUsed) st.resetUsed = {};

  for (const k of ['items', 'potion', 'buffs', 'buffAuto', 'board']) if (!st[k]) st[k] = base[k];
  if (st.boardDone === undefined) st.boardDone = 0;

function zoneById(id) { return GAME.zones.find(z => z.id === id); }
function zoneUnlocked(st, id) { return st.lv >= zoneById(id).unlock; }

  let best = GAME.zones[0];
  for (const z of GAME.zones) if (z.lv[0] <= st.lv) best = z;
  return best;
}

/* ---------- 魔物 ---------- */
function lvScale(L) { return (L + 4) / 5; } // 玩家屬性是 星數×(等級+4)，魔物用同一條曲線
function spawn(st) {
  const z = zoneById(st.zone);
  const total = z.spawns.reduce((a, s) => a + s[1], 0);
  let r = rng() * total, key = z.spawns[0][0];
  for (const [k, w] of z.spawns) { if ((r -= w) < 0) { key = k; break; } }
  const b = GAME.monsters[key], a = GAME.archetypes[b.arch];
  const L = b.rank ? z.lv[1] + 1 : randInt(z.lv[0], z.lv[1]);
  const f = lvScale(L), ramp = 1 + 0.02 * (L - 1);
  const hp = Math.round(a.hp * Math.pow(f, 1.15) * ramp * GAME.rules.mobHp);
  return {
    key, name: b.name, rank: b.rank || '', lv: L, attrs: b.attrs.slice(), stance: 0, type: b.type,
    hp, maxHp: hp,
    atk: Math.round(a.atk * f * (1 + 0.015 * (L - 1)) * GAME.rules.mobAtk),
    pdef: Math.round(a.pdef * f), mdef: Math.round(a.mdef * f),
    interval: a.interval, crit: a.crit || 0.05, bind: b.bind || 0,
    exp: Math.round(a.exp * Math.pow(f, 1.6)), silver: Math.round(a.silver * f),
    drops: b.drops, timer: a.interval * 0.6, stunned: 0

}
function expPenalty(plv, mlv) {
  const gap = plv - mlv;
  return gap > 3 ? Math.max(0.1, 1 - 0.2 * (gap - 3)) : 1;
}

/* ---------- 技能解析：把熟練度、屬性換算成實際數值 ---------- */
const lerp = (r, t) => r[0] + (r[1] - r[0]) * t;
function statIdx(name) { return GAME.statNames.indexOf(name); }
function masteryOf(st, w, i) { return (st.mastery && st.mastery[w] && st.mastery[w][i]) || [1, 0]; }
const SCALE_KEYS = ['dr', 'pdef', 'mdef', 'maxHp', 'cdr', 'tough', 'resist', 'regen', 'lifesteal', 'stunnedBonus', 'leech', 'selfDr', 'shield', 'slow', 'defDown', 'nextBonus'];
const COEF_KEYS = ['dmg', 'strike', 'counter', 'dot', 'carryPoison'];
// ml：熟練等級；回傳這一招目前的數值
function resolveSkill(d, sw, s, i, ml) {
  const t = (ml - 1) / (GAME.mastery.max - 1);
  const sv = d.stats[statIdx(s.stat)];
  const sf = Math.min(1.6, 1 + sv * 0.003); // 吃的屬性越高，非傷害效果越強（最多 1.6 倍）
  const r = { i, s, ml, t, sf };
  r.atk = Math.round((sv * 2 + 10) * (1 + GAME.sword.atkPerLv * sw) * (1 + (d.atkBuff || 0))); // 傷害以這項屬性計算
  r.magic = s.stat === '智慧' ? true : s.stat === '力量' ? false : d.magic;
  for (const k of COEF_KEYS) if (s[k]) r[k] = lerp(s[k], t);
  for (const k of SCALE_KEYS) if (s[k]) r[k] = lerp(s[k], t) * sf;
  if (s.heal) r.heal = lerp(s.heal, t);
  if (s.chance) r.chance = Math.min(0.85, lerp(s.chance, t) * sf);
  if (s.stun) r.stun = Math.min(0.85, lerp(s.stun, t) + d.stun);
  return r;
}
function applySkills(st, d, sw) {
  d.skills = []; d.actives = []; d.triggers = []; d.drs = [];
  d.lowRegen = 0; d.lifesteal = 0; d.stunnedBonus = 0; d.leech = 0;
  (GAME.skills[st.weapon] || []).forEach((s, i) => {
    if (st.lv < s.lv) return;
    const r = resolveSkill(d, sw, s, i, masteryOf(st, st.weapon, i)[0]);
    d.skills.push(r);
    if (s.type === 'active') d.actives.push(r);
    else if (s.type === 'trigger') d.triggers.push(r);
    else {
      if (r.maxHp) d.maxHp = Math.round(d.maxHp * (1 + r.maxHp));
      if (r.pdef) d.pdef = Math.round(d.pdef * (1 + r.pdef));
      if (r.mdef) d.mdef = Math.round(d.mdef * (1 + r.mdef));
      if (r.cdr) d.cdr = Math.min(0.5, d.cdr + r.cdr);
      if (r.tough) { d.ptough = Math.min(0.4, d.ptough + r.tough); d.mtough = Math.min(0.4, d.mtough + r.tough); }
      if (r.resist) d.resist = Math.min(0.9, d.resist + r.resist);
      if (r.regen) d.lowRegen = r.regen;
      if (r.lifesteal) d.lifesteal = r.lifesteal;
      if (r.stunnedBonus) d.stunnedBonus = r.stunnedBonus;
      if (r.leech) d.leech = r.leech;
      if (r.dr) d.drs.push({ v: Math.min(0.5, r.dr), when: s.when || 'always' });
    }
  });
  // 補血、護盾、緩速這類輔助招優先判斷，其餘照學會順序
  const util = r => (r.heal || r.shield || (r.slow && !r.dmg)) ? 0 : 1;
  d.actives.sort((a, b) => util(a) - util(b) || a.i - b.i);
}

/* ---------- 戰鬥時間推進 ---------- */
function newRuntime(st) {
  const d = derive(st);
  if (st.hp == null || st.hp > d.maxHp) st.hp = d.maxHp;
  if (st.en == null || st.en > d.maxEn) st.en = d.maxEn;
  return { mode: 'search', wait: GAME.rules.searchSec, mob: null, mobs: [], pTimer: 0.3, cds: {}, icd: {}, per: {}, potCd: 0, enCd: 0, shield: 0, drBuff: { v: 0, t: 0 }, nextBonus: 0, atkCount: 0, carry: 0, bound: 0, d, events: [] };
}
function emit(rt, e) { if (rt.events) rt.events.push(e); }
// 防禦減傷：K 隨攻擊方等級成長，同等級時減傷比例維持穩定
function dmgCalc(atk, def, mult, lv) { const K = 20 * (lv + 4); return Math.max(1, Math.round(atk * K / (K + def) * mult)); }
function healHp(st, rt, amt) { st.hp = Math.min(rt.d.maxHp, st.hp + amt); }

function gainExp(st, rt, amount) {
  st.exp += amount; st.stats.totalExp += amount;
  while (st.exp >= expNeed(st.lv)) {
    st.exp -= expNeed(st.lv); st.lv++;
    rt.d = derive(st); st.hp = rt.d.maxHp; st.en = rt.d.maxEn;
    emit(rt, { t: 'levelup', lv: st.lv });
    (GAME.skills[st.weapon] || []).forEach(s => { if (s.lv === st.lv) emit(rt, { t: 'learn', name: s.name }); });
  }
}
function gainMastery(st, rt, i) {
  const w = st.weapon;
  if (!st.mastery[w]) st.mastery[w] = [[1, 0], [1, 0], [1, 0]];
  const m = st.mastery[w][i];
  if (m[0] >= GAME.mastery.max) return;
  if (++m[1] >= GAME.mastery.need(m[0])) { m[1] = 0; m[0]++; rt.d = derive(st); emit(rt, { t: 'mastery', name: GAME.skills[w][i].name, lv: m[0] }); }
}

// 目前還活著的魔物
function alive(rt) { return rt.mobs.filter(m => m.hp > 0 && !m.dead); }
function pickTarget(rt, m) { return m && m.hp > 0 && !m.dead ? m : alive(rt)[0] || null; }

// 對一隻魔物造成一次傷害（普通攻擊、技能、觸發都走這裡）
function hitMob(st, rt, atk, magic, coef, o, target) {
  const d = rt.d, m = pickTarget(rt, target || rt.mob);
  if (!m) return 0;
  if (!o.sure && rng() > d.hit) { emit(rt, { t: 'miss', who: 'p', skill: o.skill || '', name: m.label, uid: m.uid, quiet: o.quiet }); return 0; }
  const kind = matchup(st.weapon, m.attrs[m.stance]);
  const crit = !!(o.forceCrit || (o.critIfCounter && kind === 'counter') || rng() < d.crit + (o.critBonus || 0));
  let def = magic ? m.mdef : m.pdef;
  if (!magic && m.defDown && m.defDown.t > 0) def *= 1 - m.defDown.v;
  if (o.ignoreDef) def *= 1 - o.ignoreDef;
  let mult = rollMult(kind, crit) * coef;
  if (rt.nextBonus && !o.keepBonus) { mult *= 1 + rt.nextBonus; rt.nextBonus = 0; }
  if (d.stunnedBonus && m.stunned > 0) mult *= 1 + d.stunnedBonus;
  const dmg = dmgCalc(atk, def, mult, st.lv);
  m.hp -= dmg;
  if (d.lifesteal) healHp(st, rt, dmg * d.lifesteal);
  emit(rt, { t: 'hit', who: 'p', dmg, kind, crit, skill: o.skill || '', name: m.label, uid: m.uid, proc: !!o.proc, quiet: !!o.quiet });
  if (crit && !o.proc) for (const r of d.triggers) if (r.s.on === 'crit' && m.hp > 0) procStrike(st, rt, r, null, m);
  if (!m.lowFired && m.hp > 0 && m.hp < m.maxHp * 0.25) { m.lowFired = true; for (const r of d.triggers) if (r.s.on === 'mobLow') procStrike(st, rt, r, null, m); }
  return dmg;
}
function procStrike(st, rt, r, coef, target) {
  const m = pickTarget(rt, target || rt.mob); if (!m) return;
  if (r.s.icd) { if ((rt.icd[r.i] || 0) > 0) return; rt.icd[r.i] = r.s.icd; } // 有內部冷卻的觸發技
  const o = { skill: r.s.name, proc: true, sure: true, critIfCounter: r.s.critIfCounter, ignoreDef: r.s.ignoreDef };
  if (r.s.aoe) for (const x of alive(rt)) hitMob(st, rt, r.atk, r.magic, coef || r.strike, o, x); // 貫穿所有魔物
  else hitMob(st, rt, r.atk, r.magic, coef || r.strike, o, m);
  gainMastery(st, rt, r.i);
}
function stunAll(rt, list, chance, dur) {
  let n = 0;
  for (const m of list) if (m.hp > 0 && rng() < chance) { m.stunned = Math.max(m.stunned, dur); n++; }
  return n;
}
function normalAttack(st, rt) {
  const d = rt.d, m = rt.mob;
  rt.atkCount++;
  hitMob(st, rt, d.atk, d.magic, 1, {}, m);
  if (d.leech && m.dot && m.dot.t > 0) healHp(st, rt, d.maxHp * d.leech);
  for (const r of d.triggers) if (r.s.on === 'everyN' && rt.atkCount % r.s.n === 0) {
    if (r.strike) procStrike(st, rt, r);
    else {
      const n = stunAll(rt, r.s.aoe ? alive(rt) : [pickTarget(rt, m)].filter(Boolean), r.chance, r.s.stunEff || 1.5);
      if (n) { emit(rt, { t: 'proc', name: r.s.name, text: r.s.aoe && n > 1 ? n + ' 隻魔物被震懾' : '魔物被震懾' }); gainMastery(st, rt, r.i); }
    }
  }
}
function pickActive(st, rt) {
  for (const r of rt.d.actives) {
    if ((rt.cds[r.i] || 0) > 0 || st.en < r.s.cost) continue;
    if (r.s.hpBelow && st.hp > rt.d.maxHp * r.s.hpBelow) continue;
    if (r.shield && rt.shield > 0) continue;
    if (r.slow && !r.dmg && alive(rt).every(x => x.slow && x.slow.t > 0)) continue;
    return r;
  }

}
function castActive(st, rt, r) {

  const targets = s.aoe ? alive(rt) : [main];
  let total = 0, crits = 0, kind = 'neutral', hitCount = 0;
  const track = (fn) => { const n = rt.events ? rt.events.length : 0; const v = fn(); const e = rt.events && rt.events[n]; if (e && e.t === 'hit') { if (e.crit) crits++; kind = e.kind; hitCount++; } total += v; };
  if (r.dmg) {
    const hits = s.hits || 1;
    const o = { skill: s.name, quiet: true, forceCrit: s.forceCrit, critBonus: s.critBonus, keepBonus: true };
    if (s.split) for (let h = 0; h < hits; h++) { const pool = alive(rt); if (!pool.length) break; track(() => hitMob(st, rt, r.atk, r.magic, r.dmg, o, pool[Math.floor(rng() * pool.length)])); }
    else for (const t of targets) for (let h = 0; h < hits && t.hp > 0; h++) track(() => hitMob(st, rt, r.atk, r.magic, r.dmg, o, t));
    if (s.chain) { const other = alive(rt).find(x => x !== main); if (other) track(() => hitMob(st, rt, r.atk, r.magic, r.dmg * s.chain, o, other)); }
    rt.nextBonus = 0;
  }
  const fx = [], live = targets.filter(t => t.hp > 0);
  if (live.length) {
    const stunChance = r.stun !== undefined ? r.stun : (r.dmg ? d.stun : 0);
    if (stunChance) { const n = stunAll(rt, live, stunChance, s.stunDur || 1.5); if (n) fx.push(n > 1 ? n + ' 隻被震懾' : '震懾'); }
    for (const t of live) {
      if (r.defDown) t.defDown = { v: Math.min(0.6, r.defDown), t: s.dur || 6 };
      if (r.slow) t.slow = { v: Math.min(0.8, r.slow), t: s.dur || 6 };
      if (r.dot) t.dot = { dps: dmgCalc(r.atk, t.mdef, r.dot, st.lv), t: s.dur || 6 };
    }
    if (r.defDown) fx.push('破防');
    if (r.slow) fx.push(live.length > 1 ? live.length + ' 隻遲緩' : '遲緩');
    if (r.dot) fx.push('中毒');
  }

// 一隻魔物倒下：給獎勵、處理擊倒觸發

  const dt = 0.1;

/* ---------- 加點 ---------- */

/* ---------- 藥品 ---------- */

    if (n) { st.items[n]--; const before = st.hp; healHp(st, rt, d.maxHp * GAME.items[n].heal); rt.potCd = GAME.potionRules.hpCd; emit(rt, { t: 'potion', name: n, v: Math.round(st.hp - before) }); }

/* ---------- 收集委託 ---------- */

/* ---------- 注劍：每級要銀兩和精魄；+5、+10、+15、+20 是突破，要特殊材料 ---------- */
function swordCost(n) {

const TYPE_TXT = { active: ['主動', 'act'], passive: ['被動', 'pas'], trigger: ['觸發', 'trg'] };
function skillDesc(s, cur, max) {
  return s.desc.replace(/\{(\w+)\}/g, (_, k) => pct(cur[k]) + (max && Math.abs(max[k] - cur[k]) > 1e-6 ? '<span class="mx">→' + pct(max[k]) + '</span>' : ''));
}
function skillPanel(w, d, mine) {
  const list = GAME.skills[w] || [], sw = st.swordLv[w] || 0;
  let h = '<div class="sec"><h3>' + wName(w) + '的招式</h3><p class="note">招式每用一次累積熟練度，最高 Lv.' + GAME.mastery.max + '；被動技每擊倒一隻魔物累積一次。→ 後面是熟練滿級時的數值。</p></div>';
  list.forEach((s, i) => {
    const learned = st.lv >= s.lv, [ml, xp] = masteryOf(st, w, i);
    const cur = resolveSkill(d, sw, s, i, ml), max = resolveSkill(d, sw, s, i, GAME.mastery.max), ty = TYPE_TXT[s.type];
    const need = GAME.mastery.need(ml), maxed = ml >= GAME.mastery.max;
    h += '<div class="skill' + (learned ? '' : ' lock') + '"><div class="sh"><b>' + s.name + '</b><span class="pill ' + ty[1] + '">' + ty[0] + '</span><span class="lvreq">' + (learned ? '熟練 Lv.' + ml : 'Lv.' + s.lv + ' 學會') + '</span></div>' +
      '<div class="sm">吃' + s.stat + (s.cd ? '・冷卻 ' + s.cd + ' 秒・耗 ' + s.cost + ' ' + d.enName : '') + '</div>' +
      '<div class="sd">' + skillDesc(s, cur, max) + '</div>' +
      (learned ? '<div class="barrow"><span>熟練</span><div class="bar exp"><i style="width:' + (maxed ? 100 : xp / need * 100) + '%"></i></div><em>' + (maxed ? '已滿' : xp + ' / ' + need) + '</em></div>' : '') +
      '<div class="sf">「' + s.flavor + '」</div></div>';
  });
  return h;
}
function renderAll() { renderHero(); renderLoc(); renderArena(); renderLog(); renderTabs(); renderPanel(); }

/* ---------- 離線戰報 ---------- */
function showReport(sum, awaySec) {
  const kills = Object.entries(sum.kills).map(([k, n]) => '<span>' + k + '</span><span>' + fmt(n) + '</span>').join('');
  const mats = Object.entries(sum.mats).map(([k, n]) => k + '×' + fmt(n)).join('、') || '無';
  const capped = awaySec > GAME.rules.offlineCapSec;
  $('#modalBody').innerHTML = '<h2>你不在的時候</h2><div class="sub">離開了 ' + dur(awaySec) + (capped ? '，結算上限 ' + (GAME.rules.offlineCapSec / 3600) + ' 小時' : '') + '。' + (sum.zoneTo !== sum.zoneFrom ? '你從' + zoneById(sum.zoneFrom).place + '・' + zoneById(sum.zoneFrom).name + '一路巡守到' + zoneById(sum.zoneTo).place + '・' + zoneById(sum.zoneTo).name + '。' : '你一直在' + zoneById(st.zone).place + '・' + zoneById(st.zone).name + '巡守。') + '</div>' +
    (sum.lvTo > sum.lvFrom ? '<div class="big">Lv.' + sum.lvFrom + ' → Lv.' + sum.lvTo + '</div>' : '') +
    '<div class="kv">' + kills + '<span>經驗</span><span>+' + fmt(sum.exp) + '</span><span>銀兩</span><span>+' + fmt(sum.silver) + '</span>' +
    (sum.rareKills ? '<span>擊倒精英／首領</span><span>' + sum.rareKills + '</span>' : '') + '<span>委託進度</span><span>+' + sum.quest + '</span><span>重傷</span><span>' + sum.deaths + ' 次</span></div>' +
    '<p class="note" style="margin:10px 0 4px">獲得材料：' + mats + '</p>' +
    (Object.keys(sum.used).length ? '<p class="note" style="margin-bottom:4px">使用藥品：' + Object.entries(sum.used).map(([k, v]) => k + '×' + v).join('、') + '</p>' : '') +
    (sum.learned.length ? '<p class="note" style="margin-bottom:4px">學會新招式：' + sum.learned.join('、') + '</p>' : '') +
    (Object.keys(sum.mastery).length ? '<p class="note">熟練度提升：' + Object.entries(sum.mastery).map(([k, v]) => k + ' Lv.' + v).join('、') + '</p>' : '') +
    '<div style="height:14px"></div><button class="btn" id="closeModal">繼續巡守</button>';
  $('#modal').classList.remove('hidden');
  panelDirty = true;
}

/* ---------- 操作 ---------- */
document.addEventListener('change', ev => {
  if (ev.target.dataset.auto) { st.potion.auto[ev.target.dataset.auto] = ev.target.checked; save(); return; }
  if (ev.target.dataset.bauto) { st.buffAuto[ev.target.dataset.bauto] = ev.target.checked; save(); return; }
  if (ev.target.id === 'potThr') { st.potion.thr = +ev.target.value; save(); toast('血量低於 ' + Math.round(st.potion.thr * 100) + '% 時自動服藥'); return; }
  if (ev.target.id === 'autoMove') { st.auto = ev.target.checked; save(); toast(st.auto ? '升級後會自動前往新區' : '會留在目前的狩獵區'); }
});
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.t) { tab = t.dataset.t; if (tab === 'map') viewChap = GAME.chapters[0].id; panelDirty = true; renderTabs(); renderPanel(); if (t.closest('#loc')) $('#tabs').scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.ch) { viewChap = t.dataset.ch; renderPanel(); return; }
  if (t.dataset.town) { townTab = t.dataset.town; renderPanel(); return; }
  if (t.dataset.buy) { if (buyItem(st, t.dataset.buy, +t.dataset.n)) { toast('買了 ' + t.dataset.buy + ' ×' + t.dataset.n); save(); } renderAll(); return; }
  if (t.dataset.craft) { if (craftItem(st, t.dataset.craft, +t.dataset.n)) { toast('調製了 ' + t.dataset.craft + ' ×' + t.dataset.n); save(); } renderAll(); return; }
  if (t.dataset.use) { if (useBuff(st, rt, t.dataset.use)) { for (const e of rt.events) handle(e); rt.events.length = 0; save(); } renderAll(); return; }
  if (t.dataset.turnin !== undefined) { const r = turnIn(st, rt, +t.dataset.turnin); if (r) { addLog('<span class="k-gold">交付' + r.r.mat + ' ×' + r.r.n + '：銀兩 +' + r.r.silver + '、經驗 +' + r.exp + '、' + r.r.item[0] + '×' + r.r.item[1] + '</span>'); for (const e of rt.events) handle(e); rt.events.length = 0; toast('交付完成'); save(); } renderAll(); return; }
  if (t.dataset.reroll !== undefined) { if (rerollRequest(st, +t.dataset.reroll)) { toast('換了一張新的委託'); save(); } renderAll(); return; }
  if (t.dataset.pm !== undefined) {
    const i = +t.dataset.pm, dd = +t.dataset.d, left = pointsFree(st, st.weapon) - pend.reduce((x, y) => x + y, 0);
    if (dd > 0 && left > 0) pend[i]++; else if (dd < 0 && pend[i] > 0) pend[i]--;
    renderPanel(); return;
  }
  if (t.dataset.z) { if (st.zone !== t.dataset.z) { st.zone = t.dataset.z; if (rt.mode === 'fight') { rt.mob = null; rt.mobs = []; rt.mode = 'search'; rt.wait = GAME.rules.searchSec; } const z = zoneById(st.zone); addLog('前往' + z.place + '・' + z.name); resetArena(); renderLoc(); renderPanel(); save(); } return; }
  if (t.dataset.w) { selWeapon = t.dataset.w; renderPanel(); return; }
  switch (t.id) {
    case 'doSword': if (upgradeSword(st)) { rt.d = derive(st); addLog('<span class="k-gold">注入' + GAME.sword.levelName + '：' + wName(st.weapon) + ' +' + st.swordLv[st.weapon] + '</span>'); toast(GAME.sword.levelName + ' +' + st.swordLv[st.weapon]); save(); } break;
    case 'doQuest': { const r = claimQuest(st); if (r) { addLog('<span class="k-gold">回報' + GAME.quest.giver + '：銀兩 +' + r.silver + '</span>'); toast('委託完成'); save(); } break; }
    case 'doSwap': {
      const ratio = st.hp / rt.d.maxHp; st.weapon = selWeapon; pend = [0, 0, 0, 0, 0, 0, 0, 0]; rt.d = derive(st);
      st.hp = Math.max(1, rt.d.maxHp * ratio); st.en = Math.min(st.en, rt.d.maxEn);
      if (rt.mode === 'fight') { rt.mob = null; rt.mobs = []; rt.mode = 'search'; rt.wait = GAME.rules.searchSec; }
      resetArena();
      addLog('換上' + wName(st.weapon)); toast('換上' + wName(st.weapon)); save(); break;
    }
    case 'doExport': save(); $('#saveBox').value = btoa(unescape(encodeURIComponent(JSON.stringify(st)))); $('#saveBox').select(); toast('存檔碼已產生，請複製保存'); return;
    case 'doImport': try {
      const o = JSON.parse(decodeURIComponent(escape(atob($('#saveBox').value.trim()))));
      if (!o || !o.weapon || !o.lv) throw 0;
      const base = newState(); st = migrate(Object.assign(base, o, { stats: Object.assign(base.stats, o.stats || {}), quest: Object.assign(base.quest, o.quest || {}) }));
      st.lastSave = Date.now(); rt = newRuntime(st); resetArena(); save(); toast('匯入完成');
    } catch (e) { toast('存檔碼無法讀取'); } break;
    case 'doReset':
      if (resetArm > Date.now()) { st = newState(); rt = newRuntime(st); logs = []; resetArena(); resetArm = 0; save(); toast('已重新開始'); }
      else { resetArm = Date.now() + 4000; } break;
    case 'closeModal': $('#modal').classList.add('hidden'); break;
    case 'doAlloc': if (addPoints(st, st.weapon, pend)) { rt.d = derive(st); st.hp = Math.min(st.hp, rt.d.maxHp); addLog('<span class="k-gold">加點完成：' + pend.map((x, i) => x ? GAME.statNames[i] + '+' + x : '').filter(Boolean).join('、') + '</span>'); pend = [0, 0, 0, 0, 0, 0, 0, 0]; toast('加點完成'); save(); } break;
    case 'cancelAlloc': pend = [0, 0, 0, 0, 0, 0, 0, 0]; break;
    case 'autoAlloc': { const add = autoPoints(st, st.weapon); if (add) { rt.d = derive(st); addLog('<span class="k-gold">照星數分配：' + add.map((x, i) => x ? GAME.statNames[i] + '+' + x : '').filter(Boolean).join('、') + '</span>'); toast('已分配'); save(); } break; }
    case 'resetAlloc':
      if (resetPtArm > Date.now()) { const c = resetCostFor(st, st.weapon); if (resetPoints(st, st.weapon)) { rt.d = derive(st); st.hp = Math.min(st.hp, rt.d.maxHp); resetPtArm = 0; toast('點數已退回' + (c ? '，花費銀兩 ' + fmt(c) : '')); save(); } }
      else resetPtArm = Date.now() + 4000;
      break;
  }
  renderAll();
});

/* ---------- 主迴圈 ---------- */
function tick() {
  const now = Date.now();
  let dt = (now - lastWall) / 1000; lastWall = now;
  if (dt > 3) { // 分頁在背景被暫停過：用同一套規則快轉
    const secs = Math.min(dt, GAME.rules.offlineCapSec);
    st.stats.offlineSec += secs;
    const { sum } = simulate(st, secs, rt);
    if (dt > 60) showReport(sum, dt);
    resetArena(); acc = 0;
  } else {
    acc += dt; st.stats.playSec += dt;
    while (acc >= 0.1) { step(st, rt, 0.1); acc -= 0.1; }
  }
  if (rt.events.length) { for (const e of rt.events) handle(e); rt.events.length = 0; renderLog(); }
  renderHero(); renderArena();
  if (panelDirty && Date.now() - lastPanelAt > 400 && !(document.activeElement && ['SELECT', 'TEXTAREA'].includes(document.activeElement.tagName))) { renderTabs(); renderPanel(); }
  if (now - lastSaveAt > 5000) save();
}

function start() {
  const loaded = load();
  st = loaded || newState();
  rt = newRuntime(st);
  if (loaded) {
    const away = (Date.now() - st.lastSave) / 1000;
    if (away > 30) {
      const secs = Math.min(away, GAME.rules.offlineCapSec);
      st.stats.offlineSec += secs;
      const { sum } = simulate(st, secs, rt);
      showReport(sum, away);
    }
  } else {
    addLog(GAME.npcs.quest.name + '：首區最近不太平，城外到處都有魔物越界，麻煩你了。');
  }
  save(); renderAll();
  lastWall = Date.now();
  setInterval(tick, 100);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
}
start();
</script>
