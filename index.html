<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121315">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>天星界・御劍者 v0.24.3</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#121315;--panel:#1b1d20;--panel2:#23262a;--line:#34373c;--text:#e9e3d6;--muted:#9a958b;--faint:#6d6961;
  --ver:#c8553d;--ver-d:#7a2f22;--jade:#5fa58f;--jade-d:#2f5a4d;--gold:#c9a45c;--gold-d:#6e5a2f;--bad:#d66a5a;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 32px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.serif{font-family:var(--serif)}
header{display:flex;align-items:baseline;justify-content:space-between;padding:4px 2px 10px}
header h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.12em}
header h1 small{font-family:var(--sans);font-size:11px;color:var(--faint);letter-spacing:0;margin-left:6px;font-weight:400}
.silver{font-size:14px;color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.seal{display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;border-radius:6px;line-height:1;flex-shrink:0}
.seal.big{width:52px;height:52px;font-size:30px;background:var(--ver);color:#f6eee0;box-shadow:inset 0 0 0 2px #f6eee033}
.seal.mid{width:36px;height:36px;font-size:20px}
.seal.sm{width:24px;height:24px;font-size:14px;border-radius:4px}
.hero{display:flex;gap:12px;align-items:center}
.hero .info{flex:1;min-width:0}
.hero .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero .name b{font-family:var(--serif);font-size:16px;font-weight:600}
.hero .name span{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{height:8px;background:#0c0d0e;border-radius:4px;overflow:hidden;margin-top:6px;position:relative}
.bar i{display:block;height:100%;border-radius:4px;transition:width .15s linear}
.bar.hp i{background:var(--ver)} .bar.en i{background:var(--gold)} .bar.exp i{background:var(--jade)}
.bar.flash{animation:flash .25s}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--bad)}100%{box-shadow:0 0 0 0 transparent}}
.barrow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.barrow .bar{flex:1;margin-top:0}
.barrow em{font-style:normal;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.bars{margin-top:8px;display:grid;gap:5px}
.zones{display:flex;gap:6px;margin:10px 0}
.zones button{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;font-family:var(--serif)}
.zones button.on{border-color:var(--jade);background:var(--jade-d);color:#e6f3ee}
.zones button:disabled{opacity:.45;cursor:default}
.zones button small{display:block;font-family:var(--sans);font-size:10px;color:var(--muted);margin-top:1px}
.zones button.on small{color:#b9dccf}
.arena{position:relative;overflow:hidden;padding:0}
.stage{position:relative;height:190px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 85%,#2c3a2f 0%,#1b1d20 62%)}
.stage svg{width:150px;height:150px;filter:drop-shadow(0 6px 10px #0008)}
.stage .mob{transition:transform .08s}
.stage .mob.hit{transform:translateX(4px) rotate(2deg)}
.stage .mob.elite{animation:breathe 2.4s ease-in-out infinite}
.stage .mob.dead{opacity:0;transform:translateY(12px) scale(.88);transition:opacity .7s,transform .7s;animation:none}
@keyframes breathe{50%{transform:scale(1.04)}}
.stage .idle{font-family:var(--serif);color:var(--muted);font-size:15px;letter-spacing:.1em;text-align:center}
.stage .idle small{display:block;font-family:var(--sans);font-size:12px;color:var(--faint);letter-spacing:0;margin-top:6px}
.floaters{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;font-weight:700;font-size:16px;text-shadow:0 2px 4px #000c;animation:up .9s ease-out forwards;white-space:nowrap}
.fl.crit{font-size:22px;color:#ffb199}.fl.counter{color:#8fe0c4}.fl.countered{color:#aaa49a}.fl.skill{font-family:var(--serif)}
@keyframes up{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px)}}
.mobinfo{padding:10px 12px 12px;border-top:1px solid var(--line)}
.mobhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mobhead b{font-family:var(--serif);font-size:16px;font-weight:600}
.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.tag.elite{background:var(--ver-d);color:#ffd9cf}
.stances{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--muted);opacity:.55}
.chip.on{opacity:1;color:var(--text);border-color:var(--text)}
.chip.good .seal{background:var(--jade);color:#0e1f19}.chip.bad .seal{background:var(--bad);color:#2a0e0a}.chip .seal{background:var(--panel2);color:var(--text)}
.match{margin-top:8px;font-size:12px;padding:6px 8px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.match.good{background:#1f3a31;color:#a6e3cd}.match.bad{background:#3d1f1b;color:#ffb9ad}
.log{margin-top:10px;padding:8px 12px;font-size:12px;line-height:1.75;min-height:150px}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.log div:nth-child(1){color:var(--text)}
.log div:nth-child(n+6){opacity:.6}
.log .k-good{color:#8fe0c4}.log .k-bad{color:#ffb199}.log .k-gold{color:var(--gold)}.log .k-lv{color:#f2d58a;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.tabs button{padding:8px 0;border-radius:8px;font-family:var(--serif);font-size:12.5px;color:var(--muted);border:1px solid transparent;position:relative}
.tabs button.on{color:var(--text);border-color:var(--line);background:var(--panel)}
.tabs button .dot{position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:3px;background:var(--ver)}
.panel{margin-top:6px}
.sec{margin-bottom:10px}
.sec h3{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:8px;letter-spacing:.05em}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.statrow{display:grid;grid-template-columns:40px 64px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.statrow:last-child{border-bottom:none}
.statrow b{font-family:var(--serif);font-weight:600}
.stars{color:var(--gold);letter-spacing:-1px;font-size:12px}
.stars i{font-style:normal;color:#3e3a33}
.statrow small{color:var(--faint);font-size:11px}
.statrow em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right}
.wcard{display:flex;gap:12px;align-items:center}
.wcard .meta{font-size:12px;color:var(--muted);line-height:1.7}
.wcard .meta b{font-family:var(--serif);font-size:17px;color:var(--text);font-weight:600}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:4px}
.pill.def{background:#26364a;color:#a9c6ea}.pill.out{background:#4a2a26;color:#f0b6a9}
.cost{display:grid;gap:6px;margin:10px 0}
.costrow{display:flex;align-items:center;gap:8px;font-size:13px}
.costrow .n{margin-left:auto;font-variant-numeric:tabular-nums}
.costrow .n.ok{color:#a6e3cd}.costrow .n.no{color:#ffb199}
.btn{display:block;width:100%;padding:12px;border-radius:10px;background:var(--ver);color:#fff6ea;font-family:var(--serif);font-size:16px;letter-spacing:.15em;font-weight:600}
.btn:disabled{background:var(--panel2);color:var(--faint);cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);letter-spacing:.05em;font-size:14px;font-weight:400}
.btn.warn{background:transparent;border:1px solid var(--ver-d);color:#ffb9ad;letter-spacing:.05em;font-size:14px;font-weight:400}
.epi{font-family:var(--serif);font-size:13px;color:var(--muted);line-height:1.9;border-left:2px solid var(--ver-d);padding-left:10px;margin:4px 0 12px}
.epi cite{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:2px}
.swordlv{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--gold)}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mat{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px}
.mat .seal{background:var(--gold-d);color:#f7e7c2}
.mat b{font-family:var(--serif);font-weight:600;font-size:14px}
.mat div{min-width:0;flex:1}
.mat small{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat em{font-style:normal;font-variant-numeric:tabular-nums;font-size:15px}
.quest .giver{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.quest .giver .seal{background:var(--jade-d);color:#d6efe6}
.quest .giver b{font-family:var(--serif);font-size:15px}
.quest .giver span{font-size:12px;color:var(--muted)}
.quest p{font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:8px}
.wgroups{display:grid;gap:10px}
.wgroup h4{font-family:var(--serif);font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.1em}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:10px;color:var(--muted)}
.wt .seal{width:30px;height:30px;font-size:18px;background:#3a3d42;color:var(--text)}
.wt.def .seal{background:#26364a;color:#cfe0f5}.wt.out .seal{background:#4a2a26;color:#f7d0c6}
.wt.cur{border-color:var(--gold)} .wt.sel{outline:2px solid var(--text);outline-offset:1px}
.wt.todo{border-style:dashed;opacity:.5}
.wt.todo .seal{background:transparent;border:1px dashed var(--faint);color:var(--faint)}
.wdetail{margin-top:10px}
.note{font-size:12px;color:var(--faint);line-height:1.7}
textarea{width:100%;height:80px;background:#0c0d0e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;font-family:ui-monospace,monospace}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{width:100%;max-width:420px;max-height:85vh;overflow:auto;padding:18px}
.modal h2{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.1em;margin-bottom:4px}
.modal .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.big{font-family:var(--serif);font-size:22px;color:#f2d58a;margin:4px 0 10px}
.loc{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.loc .where{flex:1;min-width:0}
.loc .where small{display:block;font-size:11px;color:var(--muted)}
.loc .where b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em}
.loc .where em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.loc button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--serif);font-size:14px;background:var(--panel2)}
.chaps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px}
.chaps button{padding:6px 0;border-radius:8px;border:1px solid var(--line);font-family:var(--serif);font-size:13px;line-height:1.3;color:var(--muted)}
.chaps button small{display:block;font-size:10px;font-family:var(--sans)}
.chaps button.on{border-color:var(--gold);color:var(--text);background:var(--panel2)}
.chaps button.lock{opacity:.55}
.place{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.place.cur{border-color:var(--jade)}
.place .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.place .ph b{font-family:var(--serif);font-size:15px;font-weight:600}
.place .ph span{font-size:11px;color:var(--muted)}
.place .subs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.place .subs button{padding:6px 2px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:12px;line-height:1.35}
.place .subs button small{display:block;font-size:10px;color:var(--muted)}
.place .subs button.on{border-color:var(--jade);background:var(--jade-d);color:#e6f3ee}
.place .subs button.on small{color:#b9dccf}
.place .subs button:disabled{opacity:.4;cursor:default}
.place.locked{opacity:.5}
.place .rare{font-size:10px;color:#ffb9ad;margin-left:4px}
.place .subs button{position:relative;overflow:hidden}
.place .subs button .xb{position:absolute;left:0;bottom:0;height:2px;background:var(--jade);opacity:.75}
.place .subs button.done small{color:#8fc9b4}
.place .subs button.on.done small{color:#cdeee2}
.place .ph .xp{font-size:11px;color:var(--muted);margin-left:6px;font-family:var(--sans,inherit);font-weight:400}
.loc .xbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.loc .xbar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.loc .where .xt{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.lockplaces{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lockplaces span{font-family:var(--serif);font-size:13px;padding:4px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0 10px}
.toggle input{width:40px;height:22px;accent-color:var(--jade)}
.npc{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.npc.locked{border-style:dashed;opacity:.7}
.tag.boss{background:#5a4a1a;color:#ffe9a8}
.pthead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.pthead span{font-size:13px;color:var(--muted)} .pthead b{color:var(--gold);font-size:17px;font-family:var(--serif)}
.statrow2{display:grid;grid-template-columns:36px 58px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.statrow2 b{font-family:var(--serif);font-weight:600}
.sv em{font-style:normal;font-variant-numeric:tabular-nums;font-size:14px;display:block}
.sv em.up{color:#a6e3cd}
.sv small{display:block;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.pm{display:flex;align-items:center;gap:4px}
.pm button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:17px;line-height:1}
.pm button:disabled{opacity:.25;cursor:default}
.pm span{min-width:20px;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
.ptbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.ptbar.one{grid-template-columns:1fr}
.bnty .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bnty .bt{font-size:12px;padding:2px 8px;border-radius:4px;font-family:var(--serif);background:var(--gold-d);color:#f3e2b8}
.bnty .bt.hunt{background:#5a2a24;color:#f6d0c8}.bnty .bt.clear{background:#2f4a3e;color:#cfeee0}.bnty .bt.counter{background:#3a3458;color:#ddd4f6}
.bnty .bt.elite{background:#6a2420;color:#ffd8c8}.bnty .bt.patrol{background:#2a4054;color:#d0e6f6}.bnty .bt.tower{background:#4a3a20;color:#f6e2b8}
.bnty .stars{color:var(--gold);font-size:12px;letter-spacing:1px;margin-left:4px}
.bnty .bg{font-size:11px;color:var(--muted);text-align:right}
.bnty .goal{font-size:14px;font-family:var(--serif);margin:2px 0 8px}
.bnty.done{border-color:var(--gold)}
.cxsum{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cxgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cx{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px 2px 6px;text-align:center;font-size:11px;line-height:1.35;position:relative}
.cx svg{width:100%;max-width:62px;height:auto;display:block;margin:0 auto}
.cx.unk svg{filter:brightness(0) opacity(.4)}
.cx.unk{color:var(--faint)}
.cx .st{color:var(--gold);font-size:10px;letter-spacing:1px}
.cx .st i{color:#4a4740;font-style:normal}
.cx.sel{border-color:var(--gold);background:var(--panel2)}
.cx .rk{position:absolute;top:3px;left:4px;font-size:9px;color:#ffb9ad}
.cxd{grid-column:1/-1;border:1px solid var(--gold-d);border-radius:10px;background:var(--panel2);padding:10px 12px;font-size:12px;line-height:1.7}
.cxd .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.cxd .hd b{font-family:var(--serif);font-size:15px}
.cxd .lore{color:var(--muted);font-family:var(--serif);margin-bottom:6px}
.cxd .kv{font-size:12px}
.ptbar .btn{font-size:14px;letter-spacing:.03em;padding:10px 6px;font-weight:400}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px;color:var(--faint);margin-top:8px}
.kv .up{color:#a6e3cd}
.skill{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.skill.lock{opacity:.5;border-style:dashed}
.skill .sh{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.skill .sh b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.05em}
.skill .sh .lvreq{margin-left:auto;font-size:11px;color:var(--muted)}
.pill.act{background:#4a2a26;color:#f0b6a9}.pill.pas{background:#26364a;color:#a9c6ea}.pill.trg{background:#3a3220;color:#f2d58a}
.skill .sm{font-size:11px;color:var(--muted);margin-bottom:6px}
.skill .sd{font-size:13px;line-height:1.75}
.skill .sd .mx{color:var(--faint);font-size:11px;margin-left:1px}
.skill .sf{font-family:var(--serif);font-size:12.5px;color:var(--faint);margin-top:6px;letter-spacing:.03em}
.skill .barrow{margin-top:8px}
.wskills{margin-top:8px;font-size:12px;line-height:1.7;color:var(--muted)}
.wskills b{font-family:var(--serif);color:var(--text);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chips:empty{display:none}
.chips span{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);font-variant-numeric:tabular-nums}
.chips span.buff{background:#3a3220;color:#f2d58a}
.chips span.low{background:#3d1f1b;color:#ffb9ad}
.subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.subtabs button{padding:8px;border-radius:8px;border:1px solid var(--line);font-family:var(--serif);font-size:14px;color:var(--muted)}
.subtabs button.on{border-color:var(--gold);color:var(--text);background:var(--panel2)}

select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px}
.req .giver .seal{background:var(--gold-d);color:#f7e7c2}
.stage{height:205px}

.mobc .floaters{position:absolute;inset:0;pointer-events:none}
.chip.solo{padding:3px}
.maincard{margin:0 0 10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}

.maincard .mh b{font-family:var(--serif);font-size:15px;font-weight:600}

.tag.main{background:#3a3220;color:#f2d58a}

.maincard .mb button.claim{background:var(--ver);border-color:var(--ver);color:#fff6ea}
.maincard .mb button:disabled{opacity:.4;cursor:default}
.dlg{font-family:var(--serif);font-size:14px;line-height:1.95;border-left:2px solid var(--gold-d);padding-left:10px;margin:6px 0 12px}

.goalbox{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.7;margin-bottom:10px}

.unlockline{font-size:13px;color:#a6e3cd;margin-bottom:10px}
.subtabs.three{grid-template-columns:repeat(3,1fr)}
.pwr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.pwr small{display:block;font-size:11px;color:var(--muted)}
.pwr b{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.pwr .btn{width:auto;padding:9px 14px}
.itemrow .seal.gs{background:#2a2c30;color:#1b1d20;font-size:16px}
.itemrow .seal.gs.empty{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.itemrow b.gn em{color:var(--muted)}
.itemrow b.gn.empty{color:var(--faint);font-weight:400}
.itemrow small .fx{color:var(--gold)}
.itemrow .slotn{font-size:11px;color:var(--faint);white-space:nowrap}
.itemrow .dp{font-size:12px;font-variant-numeric:tabular-nums}
.dp.up{color:#a6e3cd}.dp.dn{color:#ffb199}.dp.eq{color:var(--faint)}
.newtag{font-family:var(--sans);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--ver);color:#fff6ea;margin-left:6px;font-weight:400;vertical-align:2px}
.wtag{font-family:var(--sans);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:400;vertical-align:2px}
.named{font-size:12px;line-height:1.8;color:var(--muted);margin-top:8px}
.named b{font-family:var(--serif);color:#e6b54a;font-weight:600}
.gset{background:var(--panel2);border-radius:10px;padding:2px 10px;margin-bottom:10px}

.bulk{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:10px}
.bulk .btn{font-size:14px;letter-spacing:.03em;padding:10px 6px;font-weight:400}
/* 互動動畫 */
button{transition:transform .09s ease,background-color .2s,border-color .2s,color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.95)}
.panel.enter{animation:panelIn .24s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal{animation:fadeIn .18s ease-out}
.modal .card{animation:popIn .26s cubic-bezier(.2,.9,.3,1.15)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.toast{animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.log div:first-child{animation:logIn .3s ease-out}
@keyframes logIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.mobc{animation:mobIn .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mobIn{from{opacity:0;transform:translateY(16px) scale(.85)}to{opacity:1;transform:none}}
.stage .idle{animation:fadeIn .4s}
.maincard.ready{animation:readyGlow 1.8s ease-in-out infinite}
@keyframes readyGlow{50%{box-shadow:0 0 0 3px #c9a45c33}}
.card.lvup,.loc.lvup,.hud .hero.lvup{animation:lvGlow 1.4s ease-out}
@keyframes lvGlow{0%{box-shadow:0 0 0 0 #f2d58a00}25%{box-shadow:0 0 0 4px #f2d58aaa}100%{box-shadow:0 0 0 0 #f2d58a00}}
.wdetail.enter{animation:panelIn .24s ease-out}
.tabs button .dot{animation:dotIn .3s cubic-bezier(.2,.9,.3,1.6)}
@keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
/* 爆擊震動 */
.wrap.shakeL{animation:shakeL .22s linear}
.wrap.shakeH{animation:shakeH .34s linear}
@keyframes shakeL{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
@keyframes shakeH{12%{transform:translate(-7px,2px) rotate(-.3deg)}25%{transform:translate(6px,-3px) rotate(.3deg)}38%{transform:translate(-5px,2px)}52%{transform:translate(4px,-1px)}66%{transform:translate(-3px,1px)}82%{transform:translate(2px,0)}}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,#c8553d77 100%)}
#hurt.on{animation:hurt .45s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}
.revive{margin-top:12px;padding:8px 16px;border-radius:9px;background:var(--ver);color:#fff6ea;font-family:var(--serif);font-size:14px;letter-spacing:.05em}
.revive:disabled{background:var(--panel2);color:var(--faint)}

.vernew{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:var(--gold);color:#1a1408;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0;vertical-align:middle;line-height:16px}
.chlog h3 span{margin-left:8px;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--faint);letter-spacing:0}
.chlog ul{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--text)}
/* v0.19.3 聲音 */
.audrow{display:flex;align-items:center;gap:10px;margin:2px 0 8px;font-size:12px;color:var(--muted)}
.audrow input{flex:1;accent-color:var(--gold)}
/* v0.19.2 測試模式 */
.devbar{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 10px;border:1px dashed var(--gold-d);border-radius:10px;background:#2a2416;font-size:12px;color:var(--gold)}
.devbar span{flex:1}

.devfab{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:18;width:36px;height:36px;opacity:.8;border-radius:50%;background:#2a2416;border:1px solid var(--gold);color:var(--gold);font-family:var(--serif);font-weight:700;font-size:16px;box-shadow:0 2px 8px #000a}
.devhud{margin-top:8px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px;font-size:11px;line-height:1.7;color:var(--muted);font-variant-numeric:tabular-nums}
.devhud b{color:var(--gold);font-weight:600}
.devhud button{float:right;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:11px;color:var(--muted)}

.devrow{display:flex;gap:6px;align-items:center;margin:6px 0}

.devrow input,.devrow select{flex:1;min-width:0;width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 8px;font:inherit;font-size:13px}

.devrow .note{flex-shrink:0}
.devgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.devgrid .btn{width:100%}
.vtap{font-size:12px;color:var(--faint);padding:0 2px}
@media (prefers-reduced-motion: reduce){.panel.enter,.mobc,.log div:first-child,.modal,.modal .card{animation:none}}
/* 屬性細項 */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.srow.open{border-bottom-color:transparent}
.sx{display:grid;grid-template-columns:36px 58px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;text-align:left;font-size:13px}

.tdot i.on{background:var(--gold)}
.sdet{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:2px 0 10px;font-size:12.5px;animation:panelIn .2s ease-out}

.pill.heal{background:#2f4a3a;color:#bfe6cf}

.scfg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.scfg label{display:flex;align-items:center;gap:4px}

.pill.ultp{background:#5a4a1a;color:#ffe9a8}

.arena{position:relative}
.ultbtn{position:absolute;top:10px;right:10px;z-index:4;min-width:64px;padding:6px 10px;border-radius:10px;border:1px solid #6e5a2f;background:#1b1d20cc;color:var(--faint);font-family:var(--serif);font-size:13px;line-height:1.2;text-align:center}

@keyframes ultReady{50%{box-shadow:0 0 0 5px #f2d58a44}}
#ultFx{position:fixed;inset:0;z-index:25;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#000000cc 20%,#000000ee 100%)}
#ultFx.on{display:flex;animation:ultBg 1.6s ease-out forwards}
#ultFx .uk{font-family:var(--serif);font-size:16px;letter-spacing:.6em;color:#c9a45c;opacity:0;animation:ultIn 1.6s ease-out .05s forwards}
#ultFx .un{font-family:var(--serif);font-size:46px;font-weight:700;letter-spacing:.18em;color:#f6eee0;text-shadow:0 0 18px #f2d58a88;opacity:0;animation:ultName 1.6s cubic-bezier(.2,.9,.3,1) .12s forwards}
#ultFx .slash{position:absolute;left:-10%;right:-10%;top:50%;height:3px;background:linear-gradient(90deg,transparent,#fff6ea,#f2d58a,transparent);transform:rotate(-14deg) scaleX(0);animation:ultSlash .5s ease-out .35s forwards}
@keyframes ultBg{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes ultIn{0%{opacity:0;transform:translateY(8px)}25%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@keyframes ultName{0%{opacity:0;transform:scale(1.5);filter:blur(6px)}25%{opacity:1;transform:scale(1);filter:none}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
@keyframes ultSlash{0%{transform:rotate(-14deg) scaleX(0);opacity:1}70%{transform:rotate(-14deg) scaleX(1);opacity:1}100%{transform:rotate(-14deg) scaleX(1);opacity:0}}

.skbar .ic{position:relative;width:46px;height:46px;border-radius:9px;border:1.5px solid var(--line);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 55%,#1b1d20),#1b1d20);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:#f4efe4;overflow:hidden;text-shadow:0 1px 2px #000}

.skbar .ic b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:15px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;font-variant-numeric:tabular-nums}
.skbar .sk.ok .ic{border-color:var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}

.potbar{display:flex;gap:6px;align-items:stretch;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow-x:auto}
.potbar .lab{writing-mode:vertical-rl;font-size:11px;color:var(--gold);letter-spacing:.2em;padding:2px 0;align-self:center}
.potbar .pt{position:relative;flex:0 0 auto;width:48px;height:48px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-family:var(--serif);font-size:19px;color:var(--text);padding:0;overflow:hidden}
.potbar .pt .n{position:absolute;top:2px;right:4px;font-family:var(--sans);font-size:10px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.potbar .pt .a{position:absolute;bottom:2px;left:4px;font-family:var(--sans);font-size:9px;color:var(--jade)}
.potbar .pt .tm{position:absolute;bottom:2px;right:3px;font-family:var(--sans);font-size:9px;color:var(--gold)}
.potbar .pt i{position:absolute;left:0;right:0;bottom:0;background:rgba(10,10,14,.6)}
.potbar .pt.hp{color:#ff9a8a}.potbar .pt.hot{color:#9ee08a}.potbar .pt.en{color:#9fd8ff}.potbar .pt.buff{color:#f2d58a}
.potbar .pt.on{border-color:var(--gold)}
.potbar .pt.empty{opacity:.4}
.potbar .pt.used{animation:potUse .35s ease-out}
@keyframes potUse{0%{transform:scale(.86);background:#2a3a30}100%{transform:scale(1)}}
.loc.intower{border-color:#6e5a2f;background:linear-gradient(90deg,#2a2418,var(--panel))}
.chips span.rank{background:#3a3220;color:#f2d58a;border:1px solid #6e5a2f}
.mobs.many{flex-wrap:wrap;gap:0 2px;padding-top:8px;align-content:flex-start}
.mobs.many .mobc{flex:0 0 19%;max-width:19%}
.mobs.many .mlabel{font-size:9.5px}
.mobs.many .mlabel .seal{width:14px;height:14px;font-size:9px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;transition:opacity .3s}
/* v0.20 部位強化、命格 */
.forge{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.forge button{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}
.forge button b{font-family:var(--serif);font-size:14px}
.forge button .fgl{font-family:var(--serif);font-size:18px;color:var(--gold)}
.forge button small{font-size:11px;color:var(--muted)}
.forge button:disabled{opacity:.55}
.forge button .fgx{font-style:normal;font-size:10.5px;line-height:1.35;color:var(--gold);text-align:center}
.chips.fsets,.chips.ffilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chips.fsets button,.chips.ffilter button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);background:transparent}

.fboard{display:grid;gap:6px}
.fslot{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel2);color:var(--text)}
.fslot>span{font-family:var(--serif);font-size:15px;color:var(--gold);min-width:1.2em}
.fslot small,.fitem small,.fpick small{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.fslot.on{border-color:var(--gold)}
.fslot.empty small{color:var(--faint)}
.fslot.lock{opacity:.5}
.fst{font-family:var(--serif);font-weight:600}
.fpick,.fbag{display:grid;gap:5px}
.fpick{margin:-2px 0 6px 18px}
.fpick button,.fitem{text-align:left;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:transparent;color:var(--text)}
.fpick button.ghost{color:var(--muted)}
.fitem.on{border-color:var(--gold)}
.tag.lk{color:var(--gold);margin-left:4px}
.fpull{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.fpull .btn small{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:0;font-weight:400;opacity:.85}
.flast{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.flast small{display:block;font-size:11px;color:var(--muted)}
.flast b.new{color:#8fdcc0;font-weight:400;margin-left:4px}
.flast b.up{color:var(--gold);font-weight:400;margin-left:4px}
.fdet{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:-2px 0 4px;font-size:13px}
.fdet p{margin:0 0 6px}
.fact{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fact button,.fact select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;background:var(--panel2);color:var(--text)}
.fact button.arm{border-color:var(--ver);color:#f0a08a}

/* ===== v0.24 直式介面：戰鬥畫面當主畫面，人物資訊左下、招式最下面，功能鍵放在戰鬥畫面裡，功能頁從下面拉上來 ===== */
html,body{height:100%;overflow:hidden}
body{min-height:0;padding:0}
.wrap.app{max-width:480px;height:100vh;height:100dvh;height:var(--appH,100dvh);margin:0 auto;padding:0;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.app .devbar{margin:calc(env(safe-area-inset-top) + 4px) 8px 0;flex-shrink:0}
.field{position:relative;flex:1;min-height:0;overflow:hidden;background:#15141a;padding:0;border:0;border-radius:0}
.field .scene{position:absolute;inset:0;height:auto;margin:0;border-radius:0}
.field .stage{position:absolute;inset:0;height:auto}
.fshade{position:absolute;left:0;right:0;pointer-events:none;z-index:1}
.fshade.top{top:0;height:150px;background:linear-gradient(#121315f0,#12131500)}
.fshade.bot{bottom:0;height:110px;background:linear-gradient(#12131500,#121315)}
.field svg,.setbtn svg,.sheetx svg{width:20px;height:20px;fill:none;stroke:var(--text);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.topbar{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 10px 0}
.topbar .loc{flex:1;min-width:0;margin:0;padding:0;background:none;border:0;border-radius:0;display:block}
.topbar .loc .where{display:block;text-align:left;max-width:100%;min-width:0;padding:0;border:0;border-radius:0;background:none;font-family:var(--sans)}
.topbar .loc .where .mapic{width:15px;height:15px;margin-left:6px;vertical-align:-1px;fill:none;stroke:#e6c77a;stroke-width:2;stroke-linejoin:round;opacity:.85;filter:drop-shadow(0 1px 1px #000)}
.topbar .loc .where small{font-size:11px;color:#a8a296;text-shadow:0 1px 2px #000}
.topbar .loc .where b{font-size:17px;text-shadow:0 1px 3px #000}
.topbar .loc .where em{font-size:11.5px;color:#a8a296;margin-left:5px}
.topbar .loc .xrow{display:flex;align-items:center;gap:6px;margin-top:3px}
.topbar .loc .xbar{width:72px;flex-shrink:0;margin:0}
.topbar .loc .xt{display:block;font-size:10.5px;color:#a8a296;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.topbar .loc #towerLeave{margin-left:8px;padding:2px 9px;border:1px solid var(--gold-d);border-radius:7px;font-family:var(--serif);font-size:12px;background:#1b1d20cc;vertical-align:3px}
.topbar .loc .where em.tw{display:block;margin:2px 0 0;font-size:10.5px}
.topbar .loc.intower{background:none;border:0}
.topbar .tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.topbar .trow{display:flex;align-items:center;gap:8px}
.topbar .silver{font-size:13px;text-shadow:0 1px 2px #000;white-space:nowrap}
.setbtn{position:relative;width:40px;height:40px;border-radius:20px;background:#121315b8;border:1px solid #c9a45c59;display:flex;align-items:center;justify-content:center}
.setbtn.on{border-color:var(--gold)}
.setbtn .dot,.fn .dot{position:absolute;top:0;right:2px;width:9px;height:9px;border-radius:5px;background:var(--bad);animation:dotIn .3s cubic-bezier(.2,.9,.3,1.6)}
.fn .dot{right:6px}
.field .boosts{position:static;display:flex;gap:4px;pointer-events:auto}
.field .boosts button{padding:1px 7px;border-width:1px;font-size:10.5px;font-weight:500}
.field .maincard{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 76px);z-index:6;margin:0;padding:0;background:none;border:0;display:flex;gap:6px;animation:none}
.field .maincard .mstrip{position:relative;flex:1;min-width:0;height:40px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:10px;background:#1b1d20e0;border:1px solid var(--line);overflow:hidden;text-align:left}

.field .maincard .mstrip .mp{flex-shrink:0;font-size:11.5px;color:var(--gold);font-variant-numeric:tabular-nums}

.field .maincard .mact{flex-shrink:0;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-family:var(--serif);font-size:14px}
.field .maincard .mact.claim{background:var(--ver);border-color:var(--ver);color:#fff6ea;animation:readyGlow 1.8s ease-in-out infinite}
.field .mobinfo{position:absolute;left:72px;right:72px;top:calc(env(safe-area-inset-top) + 126px);z-index:5;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#121315b8}
.field .mobinfo.quiet{background:#12131599;padding:5px 9px}
.field .mobinfo .note{font-size:11px;line-height:1.5;color:#a8a296}
.field .mobinfo .toggle{padding:4px 0 0;font-size:11px}
.field .mobhead b{font-size:13px}
.field .mobhead span{font-size:11px;color:#a8a296;white-space:nowrap}
.field .mobinfo .bar.hp{height:5px;margin-top:4px}
.field .mobinfo .mrow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px}
.field .mobinfo .stances{margin:0;gap:3px;flex-wrap:nowrap}
.field .mobinfo .chip.solo{padding:1px;border-radius:5px}
.field .mobinfo .chip .seal.sm{width:18px;height:18px;font-size:11px}
.field .mobinfo .match{margin:0;padding:0;background:none;font-size:10.5px;color:#a8a296;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .mobinfo .match.good{background:none;color:#8fe0c4}.field .mobinfo .match.bad{background:none;color:#ffb199}
.side{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 128px);display:flex;flex-direction:column;gap:6px}
.side.left{left:6px}.side.right{right:6px}
.fn{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:58px}

.fn .fnl{font-size:10.5px;line-height:1.3;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000}
.logtk{position:absolute;left:10px;bottom:10px;z-index:4;width:calc(100% - 120px);display:flex;flex-direction:column;gap:1px;text-align:left;font-size:11px;line-height:1.45;color:var(--muted)}
.logtk div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000,0 0 3px #000}
.logtk div:last-child{color:var(--text)}
.logtk .k-good,.loglist .k-good{color:#8fe0c4}.logtk .k-bad,.loglist .k-bad{color:#ffb199}.logtk .k-gold,.loglist .k-gold{color:var(--gold)}.logtk .k-lv,.loglist .k-lv{color:#f2d58a;font-weight:600}
.loglist div{font-size:12.5px;line-height:1.7;padding:2px 0;border-bottom:1px solid #2a2d31;color:var(--muted)}
.loglist div:first-child{color:var(--text)}
.field .ultbtn{top:auto;bottom:10px;right:10px;z-index:5;width:76px;height:76px;min-width:0;padding:0;border:0;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),#34373c 0);display:flex;align-items:center;justify-content:center;line-height:1.2}
.field .ultbtn .uin{width:66px;height:66px;border-radius:50%;background:#1b1d20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.field .ultbtn .uin b{font-family:var(--serif);font-size:16px;color:var(--gold);font-weight:600}
.field .ultbtn .uin small{font-size:10px;color:var(--muted)}
.field .ultbtn.ready{background:conic-gradient(#f2d58a 100%,#f2d58a 0);animation:ultReady 1.6s ease-in-out infinite}
.field .ultbtn.ready .uin{background:linear-gradient(135deg,#3a3220,#1b1d20)}
.field .ultbtn.ready .uin small{color:#f2d58a}
.field .scov{top:44%;bottom:auto;z-index:3}
.field .devhud{position:absolute;left:72px;right:72px;bottom:96px;z-index:5;margin:0;background:#121315d9}
.hud{flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--bg)}
.hudrow{display:flex;gap:8px;align-items:stretch}
.hud .hero{flex:1;min-width:0;display:flex;gap:9px;align-items:center;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.hud .hero .seal.big{width:46px;height:46px;font-size:26px}
.hud .hero .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hud .hero .name{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.hud .hero .name b{font-family:var(--serif);font-size:14px;font-weight:600;flex-shrink:0}
.hud .hero #pChips{font-size:10.5px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .hero #pChips .buff{color:#f2d58a}
.hud .barrow{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.hud .barrow .bar{flex:1;margin:0;height:6px;background:#ffffff14}
.hud .barrow.en .bar{height:4px}.hud .barrow.exp .bar{height:3px}
.hud .barrow em{font-style:normal;min-width:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.potwrap{width:118px;flex-shrink:0;display:flex;gap:4px}
.hud .potbar{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:40px;gap:5px;height:85px;margin:0;padding:0;border:0;border-radius:0;background:none;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.hud .potbar::-webkit-scrollbar{display:none}
.hud .potbar .pt{width:auto;height:40px;font-size:16px;border-radius:8px}
.hud .potbar .pt:nth-child(6n+1){scroll-snap-align:start}
.hud .potbar .pt .n{font-size:9.5px;right:3px;top:1px}
.hud .potbar .pt .a{font-size:8.5px;left:3px;bottom:1px}
.potdots{display:flex;flex-direction:column;justify-content:center;gap:3px}
.potdots i{width:4px;height:6px;border-radius:2px;background:#4a4d52}
.potdots i.on{height:12px;background:var(--gold)}
.hud .skbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0}
.hud .skbar .ic{width:56px;height:56px;font-size:24px;border-radius:12px}
.hud .skbar .sk.empty .ic{border:1px dashed #4a4d52;background:none;color:var(--faint);font-size:20px}
.hud .skbar .sk.empty .nm{color:var(--faint)}
.sheet{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;justify-content:flex-end}
.sheet.hidden{display:none}
.sheetbg{position:absolute;inset:0;background:#000a}
.sheetbox{position:relative;height:calc(100% - env(safe-area-inset-top) - 70px);display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;animation:sheetIn .24s ease-out}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheethd{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 16px}

.sheethd b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.08em}
.sheetx{width:40px;height:40px;border-radius:20px;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.sheet .tabs{position:static;flex-shrink:0;grid-template-columns:repeat(4,1fr);gap:4px;margin:0;padding:0 10px 10px;border-bottom:1px solid var(--line);background:none;z-index:auto}

.setver{display:flex;align-items:center;justify-content:space-between;gap:10px}

.setver span{font-size:11.5px;color:var(--muted)}
.setver .btn{width:auto;padding:8px 14px}
.toast{bottom:calc(env(safe-area-inset-bottom) + 200px)}
.devfab{left:auto;right:72px;bottom:auto;top:calc(env(safe-area-inset-top) + 124px)}

  .fn .fi{width:38px;height:38px}
  .fn .fnl{font-size:9.5px}
  .field .ultbtn{width:66px;height:66px}.field .ultbtn .uin{width:57px;height:57px}
  .hud{gap:6px}

}

#vprobe{position:fixed;left:0;top:0;width:1px;height:100%;opacity:0;pointer-events:none;z-index:-1}
/* ===== v0.24.1 寬螢幕（平板橫放、電腦）：功能頁固定在右邊；再寬一點，左邊放位階、懸賞、完整的戰鬥紀錄 ===== */
.lside{display:none}
@media (min-width:760px) and (min-height:500px){
  .wrap.app{max-width:none;display:grid;grid-template-columns:minmax(360px,520px) minmax(340px,460px);grid-template-rows:auto minmax(0,1fr) auto;justify-content:center}
  .app .devbar{grid-column:1/-1;grid-row:1}
  .field{grid-column:1;grid-row:2}
  .hud{grid-column:1;grid-row:3}
  .sheet{position:relative;inset:auto;z-index:auto;grid-column:2;grid-row:2/4;min-height:0;border-left:1px solid var(--line)}
  .sheetbg,.sheethd .grip{display:none}
  .sheetbox{flex:1;height:100%;min-height:0;padding-top:env(safe-area-inset-top);border-top:0;border-radius:0;animation:none}
  .sheet:not(.closable) .sheetx{display:none}
  .sheethd{padding:12px 12px 8px 16px;min-height:56px}
}
@media (min-width:1180px) and (min-height:500px){
  .wrap.app{grid-template-columns:300px minmax(400px,540px) minmax(360px,460px)}
  .lside{display:flex;flex-direction:column;gap:10px;grid-column:1;grid-row:2/4;min-height:0;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);border-right:1px solid var(--line);background:var(--bg)}
  .field{grid-column:2}.hud{grid-column:2}.sheet{grid-column:3}
  .field .logtk{display:none}
}
.bar.hp b{position:absolute;top:0;height:100%;display:none;background:#a9d6ff;border-radius:4px;box-shadow:inset 0 0 0 1px #e6f4ff80;transition:width .15s linear,left .15s linear}
.lsec{flex-shrink:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.lsec h4{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-family:var(--serif);font-size:14px;font-weight:600}
.lsec h4 small{font-family:inherit;font-size:11px;font-weight:400;color:var(--muted)}
.lsec .barrow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.lsec .barrow .bar{flex:1;margin:0;height:4px}
.lsec .barrow em{font-style:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
.lsec .note{margin:4px 0 0;font-size:11px}
.lrank{width:100%;display:block;text-align:left}
.lrank b{font-family:var(--serif);font-size:18px;color:var(--gold);font-weight:600}
.lbn{padding:7px 0;border-top:1px solid #2a2d31}
.lbn:first-of-type{border-top:0;padding-top:2px}
.lbn .lg{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.45;margin-bottom:4px}
.lbn .lg span{flex:1;min-width:0}
.lbn .lg i{font-style:normal;font-size:10px;color:var(--gold);white-space:nowrap}
.lbn .btn{width:100%;margin-top:6px;padding:6px 0;font-size:12.5px}
.lbn.done .lg span{color:#f2d58a}
.lslog{flex:1;min-height:0;display:flex;flex-direction:column}
.lslog .loglist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.lslog .loglist div{font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap app" id="app">
  <div class="devbar hidden" id="devBar"><span>測試模式・不同步雲端</span><button data-dev="open">面板</button><button data-dev="exit">離開</button></div>
  <!-- v0.24 直式介面：戰鬥畫面就是主畫面；功能鍵放在戰鬥畫面裡，打開時從下面拉上來 -->
  <section class="field arena" id="field">
    <div class="scene hidden" id="scene"><canvas id="scv"></canvas><div class="scov" id="scOv"></div></div>
    <div class="stage" id="stage"><div class="floaters" id="floaters"></div></div>
    <div class="fshade top"></div><div class="fshade bot"></div>
    <header class="topbar">
      <div class="loc" id="loc"></div>
      <div class="tr">
        <div class="trow"><span class="silver" id="silver">銀兩 0</span><button class="setbtn" data-t="settings" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button></div>
        <div class="boosts" id="boosts"></div>
      </div>
    </header>
    <section class="maincard" id="mainCard"></section>
    <div class="mobinfo" id="mobinfo"></div>
    <nav class="side left"><button class="fn" data-t="weapon" aria-label="武器"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4 10 14M20 4h-4M20 4v4M7 13l4 4M5 19l3.5-3.5"/></svg></span><span class="fnl">武器</span></button><button class="fn" data-t="quest" aria-label="城鎮"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11M10 21v-6h4v6"/></svg></span><span class="fnl">城鎮</span></button><button class="fn" data-t="codex" aria-label="圖鑑"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v-15zM5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7h6"/></svg></span><span class="fnl">圖鑑</span></button></nav>
    <nav class="side right"><button class="fn" data-t="gear" aria-label="背包・裝備"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8V6.5a4 4 0 0 1 8 0V8"/><path d="M4.5 8h15l-1 12.5h-13L4.5 8z"/><path d="M9.5 12.5h5"/></svg></span><span class="fnl">背包・裝備</span></button><button class="fn" data-t="stats" aria-label="屬性"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-11"/></svg></span><span class="fnl">屬性</span></button><button class="fn" data-t="skill" aria-label="技能"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg></span><span class="fnl">技能</span></button><button class="fn" data-t="sword" aria-label="強化"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h10M6 20l1.5-4h5L14 20"/><path d="M13.5 3.5l6 6-2.5 2.5-6-6z"/><path d="M12.2 8.8 7 14"/></svg></span><span class="fnl">強化</span></button><button class="fn" data-t="fate" aria-label="命格"><span class="fi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.4l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7L12 3.5z"/></svg></span><span class="fnl">命格</span></button></nav>
    <button class="logtk" id="log" data-t="log" aria-label="展開戰鬥紀錄"></button>
    <button class="ultbtn hidden" id="ultBtn"></button>
    <div class="devhud hidden" id="devHud"></div>
  </section>
  <section class="hud" id="hud">
    <div class="hudrow">
      <button class="hero" data-t="stats" aria-label="角色資訊">
        <span class="seal big" id="pSeal">銀</span>
        <span class="info">
          <span class="name"><b id="pLv">Lv.1</b><span id="pChips"></span></span>
          <span class="barrow hp"><span class="bar hp" id="hpBarWrap"><i id="hpBar"></i><b id="shBar"></b></span><em id="hpTxt"></em></span>
          <span class="barrow en"><span class="bar en"><i id="enBar"></i></span><em><span id="enTxt"></span> <span id="enName">氣力</span></em></span>
          <span class="barrow exp"><span class="bar exp"><i id="expBar"></i></span><em id="expTxt"></em></span>
          <span class="hidden" id="pName"></span>
        </span>
      </button>
      <div class="potwrap"><div class="potbar" id="potBar"></div><div class="potdots" id="potDots"></div></div>
    </div>
    <div class="skbar" id="skBar"></div>
  </section>
  <aside class="lside" id="lside" aria-label="位階、懸賞、戰鬥紀錄"><div class="lsec" id="lsRank"></div><div class="lsec" id="lsBounty"></div><div class="lsec lslog"><h4>戰鬥紀錄<small>最近 40 則</small></h4><div class="loglist" id="lsLog"></div></div></aside>
  <section class="sheet hidden" id="sheet" aria-label="功能">
    <div class="sheetbg" id="sheetBg"></div>
    <div class="sheetbox">
      <div class="sheethd"><span class="grip"></span><b id="sheetTitle"></b><button class="sheetx" id="sheetClose" aria-label="關閉，回到戰鬥"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <nav class="tabs" id="tabs">
        <button data-t="stats">屬性</button><button data-t="skill">技能</button><button data-t="sword">強化</button><button data-t="fate">命格</button>
      </nav>
      <section class="panel" id="panel"></section>
    </div>
  </section>
</div>

<div id="vprobe" aria-hidden="true"></div>
<div class="modal hidden" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast hidden" id="toast"></div>

  // 加點：每級拿到點數，每把武器各自一套
  // v0.19.9 改成天堂M的做法：每點固定 +1，星數只決定升級時自動長多少；畫面上的屬性一律是整數
  // v0.23：每級 1 點（原本 5 點），屬性的數字整體縮成約 1/11；攻擊、血量、防禦每點換到的放大，打怪速度和耐打度不變
  points: {
    perLevel: 1,
    baseK: 0.1,   // 升級自動長的屬性＝星數 ×（等級＋1.25）÷ 10（＝v0.22 的 星數 ×（舊等級＋4）÷ 2 縮成 1/11）
    // 不四捨五入：數字小了以後，四捨五入會讓前幾級差很多（1★ 屬性前三級都是 0）；畫面上顯示整數
    base(stars, lv) { return stars * (lv + 1.25) * this.baseK; },
    resetCost(lv) { const g = gOf(lv); return Math.round(20 * g * g); } // 每把武器第一次重置免費
  },

   e＝屬性 ÷（等級＋4），也就是平均每一級有幾點這項屬性（大約等於星數，加點、裝備會再往上推）。
   同一個等級多加點一定有感，但永遠撞不到上限；等級越高，要更多屬性才能維持同樣的百分比，加點一直有意義。 */
/* v0.23 百分比改成「天花板＋成長曲線」：效果＝天花板 ×（屬性 ÷ S550）^1.37，最多到天花板。
   S550＝5★ 屬性在 Lv.550（全遊戲等級上限）照星數比例加點時的數值。前面長得很慢（Lv.6 約天花板的 0.3%），越後面越快；
   天花板是全遊戲最多，屬性、加點門檻、裝備、部位強化、命格加在一起也不會超過。
   氣力上限、招式效果強度（sf）還是用原本的評等（跟等級比），不算在百分比裡 */
GAME.formula = {
  atkBase: 20, atkK: 16, hpBase: 85, hpPerLv: 27, hpK: 66, defK: 50, regenK: 0.5,
  atk(S) { return this.atkBase + Math.round(Math.max(0, S) * this.atkK); },
  hpStat(S) { return Math.round(Math.max(0, S) * this.hpK); },
  hp(S, lv) { return this.hpBase + Math.round(this.hpPerLv * (lv || 1)) + this.hpStat(S); },
  def(S) { return Math.round(Math.max(0, S) * this.defK); },
  eff(S, lv) { return Math.max(0, S) / (0.2 * ((lv || 1) + 1.25)); }, // 評等用：大約等於平均每一級有幾點（v0.22 的尺度）
  R: { en: [200, 2], sf: [0.8, 2] },
  rate(k, S, lv) { const [c, h] = this.R[k], e = this.eff(S, lv); return c * e / (e + h); },

  S550: 416, pow: 1.37, hitBase: 0.96,
  curve(S) { return Math.min(1, Math.pow(Math.max(0, S) / this.S550, this.pow)); },

function step(st, rt, dt) {
  const R = GAME.rules;

  st.en = Math.min(d.maxEn, st.en + R.energyRegen * (1 + (d.enRegen || 0)) * dt);

  // 命格的計時

  if (rt.pianT > 0) rt.pianT -= dt;
  if (rt.yujinT > 0) rt.yujinT -= dt;

  shopTick(st, dt);
  tickHot(st, rt, dt);
  d = rt.d;
  if (rt.drBuff.t > 0) rt.drBuff.t -= dt;
  if (rt.mode === 'down') {
    rt.wait -= dt;
    if (rt.wait <= 0) { st.hp = d.maxHp; rt.mode = 'search'; rt.wait = R.searchSec; emit(rt, { t: 'revive' }); }
    return;
  }
  if (rt.mode === 'rest') {
    st.hp = Math.min(d.maxHp, st.hp + d.maxHp * 0.06 * (1 + d.heal) * (1 + d.restUp) * dt);

    return;
  }
  if (rt.mode === 'clear') {

  }
  if (rt.mode === 'search') {
    st.hp = Math.min(d.maxHp, st.hp + d.maxHp * 0.01 * (1 + d.heal) * dt);

      if (st.auto && rt.autoMove && !rt.tower) { rt.autoMove = false; const b = bestZone(st); if (b.id !== st.zone && b.idx > zoneById(st.zone).idx) { st.zone = b.id; emit(rt, { t: 'move', zone: b.id }); } } // 只在升級或探索完成後往前換區，手動前往的地方不會被拉走

  }
  autoPotions(st, rt);
  if (!(rt.tower && rt.tower.id === 'origin')) st.hp = Math.min(d.maxHp, st.hp + (d.maxHp * (0.003 * (1 + d.heal) + d.regenPct) + d.regen) * dt);
  const FT = d.fate || {};
  if (FT.kumu) { // 命格・枯木逢春
    if (rt.kumuT > 0) { rt.kumuT -= dt; st.hp = Math.min(d.maxHp, st.hp + d.maxHp * FT.kumu * dt); }
    else if (st.hp < d.maxHp * 0.3 && (rt.kumuCd || 0) <= 0) { rt.kumuT = 5; rt.kumuCd = 60; emit(rt, { t: 'proc', name: '枯木逢春', text: '血量慢慢回來', quiet: true, fate: true }); }
  }
  if (rt.mob) { if (rt.focus.uid !== rt.mob.uid) { rt.focus.uid = rt.mob.uid; rt.focus.t = 0; } rt.focus.t += dt; } // 命格・傷及要害：盯著同一隻的時間
  if (d.lowRegen && st.hp < d.maxHp * 0.3) st.hp += d.maxHp * d.lowRegen * dt;
  // 魔物身上的狀態
  for (const m of rt.mobs) {
    if (m.dead) continue;

    if (m.slow && m.slow.t > 0) m.slow.t -= dt;

    rt.per[r.i] = (rt.per[r.i] === undefined ? r.s.period : rt.per[r.i]) - dt * (rt.perBoost > 0 && r.s.on === 'periodic' && !r.heal ? 2 : 1);
    if (rt.per[r.i] <= 0) {

      rt.pTimer += rt.d.interval / (1 + (rt.haste.n ? rt.haste.n * rt.haste.v : 0)) / (1 + pian);

        if (!rt.offline && st.autoRevive) { const c = reviveCost(st, rt); if (st.silver >= c) { st.silver -= c; rt.wait = 0.6; emit(rt, { t: 'revivePaid', cost: c, auto: true }); } }
        return;
      }
    }
  }

}

/* ---------- 位階 ---------- */
function deeds(st) { if (!st.deeds) st.deeds = { k: {}, pl: {} }; return st.deeds; }

/* ---------- 天陰五大塔 ---------- */
function towerOpen(st) { return st.lv >= GAME.towerRules.openLv || !!(st.main && ((st.main.ch || 0) > 0 || st.main.done)); }

// 樓層的魔物：等級跟著層數走，每座塔再套自己的規則
const TOWER_POOL = [];
for (const z of GAME.zones) for (const [k] of z.spawns) if (!GAME.monsters[k].rank && !TOWER_POOL.includes(k)) TOWER_POOL.push(k);

  const pickPool = () => T.id === 'sword' ? (rng() < 0.6 ? 'jianying' : 'canying') : TOWER_POOL[Math.floor(rng() * TOWER_POOL.length)];
  let n = T.id === 'moon' ? Math.min(12, 3 + Math.floor(F / 4) + (boss ? 1 : 0)) : 2 + Math.min(2, Math.floor(F / 8));

    const R = GAME.towerRules; m.maxHp = m.hp = Math.round(m.maxHp * (R.hpBase + R.hpPer * F)); m.atk = Math.round(m.atk * (R.atkBase + R.atkPer * F)); // 越高層越硬

/* ---------- 技能書 ---------- */
function bookKey(w, i) { return w + ':' + i; }
function bookLv(w, i) { return i === 'u' ? GAME.ult.lv : GAME.skills[w][i].lv; }
function bookName(w, i) { return '《' + w + '・' + (i === 'u' ? GAME.ult.name + '・' + GAME.ults[w].name : GAME.skills[w][i].name) + '》'; }

function learnBook(st, rt, w, i) {
  if (i === 'u') st.ultKnown[w] = true;
  else {
    if (!st.learned[w]) st.learned[w] = [true];
    st.learned[w][i] = true;
    const s = GAME.skills[w][i]; // 招式欄滿了（5 個主動招都開著），新學的先不放進去
    if (s.type === 'active' && barCount(st, w) > GAME.skillBar) setSkillCfg(st, w, i, { on: false });
  }

}
// 拿到一本書：等級夠就馬上讀，不夠就先收著，升級時自動讀
function gainBook(st, rt, w, i, src) {

  if (st.lv >= bookLv(w, i)) learnBook(st, rt, w, i);

  return true;
}
function readBooks(st, rt) {

    const [w, j] = k.split(':'), i = j === 'u' ? 'u' : +j;

}
function skillLand(w, i) { const s = GAME.skills[w] && GAME.skills[w][i]; return (s && s.land) || '天霖國'; }

function shopBooks(w) { return (GAME.skills[w] || []).map((s, i) => i).filter(i => i > 0 && skillLand(w, i) === GAME.bookNpc.land); }

}

}
// 魔物掉落：技能書挑還沒學、也還沒拿到的；一半機率是目前這把武器
function pickBook(st, kinds) {
  const play = playableWeapons(), first = rng() < 0.5 ? st.weapon : play[Math.floor(rng() * play.length)];
  for (const w of [first, st.weapon]) {
    const ks = kinds === 'skill' ? (GAME.skills[w] || []).map((s, i) => i).filter(i => i > 0 && GAME.skills[w][i].lv <= st.lv + GAME.books.dropAhead) : kinds;

}

/* ----- 地面花紋 ----- */
const PATCH = {
  path(x, r, o) {
    const W = SC.WW, H = SC.WH, y0 = H * (.3 + r() * .4), A = 16 + r() * 22, f = .008 + r() * .01, ph = r() * 6, w = o.w || 13, c = o.c;

  },
  river(x, r, o) {
    const W = SC.WW, H = SC.WH, y0 = H * (.25 + r() * .5), A = 10 + r() * 14, ph = r() * 6, w = o.w || 20, c = o.c;
    for (let px = 0; px < W; px++) { const cy = y0 + Math.sin(px * .012 + ph) * A; for (let k = -w - 2; k <= w + 2; k++) { const e = Math.abs(k) / w; R(x, px, Math.round(cy + k), 1, 1, e > 1 ? (o.edge || '#cfd9d6') : e > .8 ? tint(c, 1.15) : r() < .03 ? tint(c, 1.4) : c); } }
    SC.water.push({ river: true, y0, A, ph, w });
  },
  water(x, r, o) {
    const W = SC.WW, H = SC.WH;
    for (let n = 0; n < (o.n || 2); n++) {
      const cx = 40 + r() * (W - 80), cy = 40 + r() * (H - 80), rx = 18 + r() * 26, ry = 9 + r() * 12;
      for (let py = Math.floor(cy - ry - 3); py < cy + ry + 3; py++) for (let px = Math.floor(cx - rx - 3); px < cx + rx + 3; px++) {
        const dd = ((px - cx) / rx) ** 2 + ((py - cy) / ry) ** 2 + Math.sin(px * .3 + py * .2) * .05;
        if (dd > 1.14) continue;
        R(x, px, py, 1, 1, dd > 1 ? (o.edge || '#cfd9d6') : dd > .78 ? tint(o.c, 1.15) : r() < .04 ? tint(o.c, 1.4) : o.c);
      }
      SC.water.push({ cx, cy, rx, ry });
    }
  },
  paddy(x, r, o) {
    const W = SC.WW, H = SC.WH, cw = 30, ch = 20, ox = r() * 20 | 0, oy = r() * 20 | 0;
    for (let gy = oy - ch; gy < H; gy += ch + 4) for (let gx = ox - cw; gx < W; gx += cw + 4) {
      if (r() < .25) continue;
      R(x, gx, gy, cw, ch, '#4f7a86'); R(x, gx, gy, cw, 1, '#3d636e');
      for (let yy = gy + 3; yy < gy + ch - 1; yy += 4) for (let xx = gx + 2 + (yy >> 2 & 1) * 2; xx < gx + cw - 1; xx += 4) { R(x, xx, yy, 1, 2, '#6fa04a'); R(x, xx, yy, 1, 1, '#94c25e'); }
    }
  },
  pave(x, r, o) {
    const W = SC.WW, H = SC.WH;
    let X0 = 0, Y0 = 0, X1 = W, Y1 = H;
    if (!o.all) { const w = 120 + r() * 80, h = 70 + r() * 50; X0 = r() * (W - w) | 0; Y0 = r() * (H - h) | 0; X1 = X0 + w; Y1 = Y0 + h; R(x, X0 - 1, Y0 - 1, X1 - X0 + 2, Y1 - Y0 + 2, o.m); }
    for (let y = Y0; y < Y1; y++) for (let xx = X0; xx < X1; xx++) {
      const row = Math.floor((y - Y0) / 7), mortar = (y - Y0) % 7 === 0 || (xx - X0 + (row & 1) * 6) % 12 === 0;
      R(x, xx, y, 1, 1, mortar ? o.m : r() < .06 ? tint(o.c, .9) : (xx - X0 + (row & 1) * 6) % 12 === 1 ? tint(o.c, 1.12) : o.c);
    }

  },
  flowers(x, r, o) {
    const W = SC.WW, H = SC.WH;
    for (let k = 0; k < (o.n || 8); k++) { const cx = r() * W, cy = r() * H, rad = 10 + r() * 16; for (let i = 0; i < rad * 2.2; i++) { const a = r() * 6.28, d = r() * rad; const px = cx + Math.cos(a) * d | 0, py = cy + Math.sin(a) * d * .7 | 0, col = o.c[r() * o.c.length | 0]; R(x, px, py, 1, 1, col); if (r() < .4) R(x, px + 1, py, 1, 1, tint(col, .8)); } }
  },

    for (let k = 0; k < (o.n || 4); k++) { const X = r() * (W - 80) | 0, Y = r() * (H - 50) | 0, w = 50 + r() * 50 | 0, h = 26 + r() * 24 | 0; R(x, X, Y, w, h, '#a8883a'); for (let yy = Y; yy < Y + h; yy += 2) for (let xx = X + (yy & 2); xx < X + w; xx += 3) R(x, xx, yy, 1, 2, r() < .5 ? '#d6b552' : '#e8cc6a'); }
  },
  dirt(x, r, o) { const W = SC.WW, H = SC.WH; for (let k = 0; k < (o.n || 4); k++) { const cx = r() * W, cy = r() * H, rx = 10 + r() * 22, ry = 6 + r() * 10; for (let py = cy - ry | 0; py < cy + ry; py++) for (let px = cx - rx | 0; px < cx + rx; px++) { const dd = ((px - cx) / rx) ** 2 + ((py - cy) / ry) ** 2; if (dd < 1 - r() * .2) R(x, px, py, 1, 1, r() < .1 ? tint(o.c, 1.15) : o.c); } } },

  cracks(x, r, o) { const W = SC.WW, H = SC.WH; for (let k = 0; k < (o.n || 8); k++) { let px = r() * W, py = r() * H, a = r() * 6.28; for (let i = 0; i < 10 + r() * 14; i++) { R(x, px | 0, py | 0, 1, 1, 'rgba(0,0,0,.35)'); a += (r() - .5) * 1.2; px += Math.cos(a); py += Math.sin(a) * .6; } } },

// 戰鬥數據：在 handle() 一開頭呼叫；離線快轉的事件不算
function devTrack(e) {
  if (!DEV.hud || DEV.skip) return;
  if (e.t === 'kill') { DEV.kills.push(DEV.clock); if (DEV.kills.length > 21) DEV.kills.shift(); }

function devHudRender() {
  if (!DEV.hud) return;
  const el = $('#devHud'); if (!el) return;
  const now = DEV.clock, cut = now - 60, keep = a => { while (a.length && a[0][0] < cut) a.shift(); return a; };
  keep(DEV.hits); keep(DEV.dealt);
  const span = Math.max(1, Math.min(60, now - DEV.t0)), k = DEV.kills, n = k.length;
  let per = '—';
  if (n > 20) per = ((k[n - 1] - k[n - 21]) / 20).toFixed(1) + ' 秒';
  else if (n) per = ((k[n - 1] - DEV.t0) / n).toFixed(1) + ' 秒';
  const taken = DEV.hits.reduce((a, h) => a + h[1], 0) / span * 60 / Math.max(1, rt.d.maxHp);
  const dps = DEV.dealt.reduce((a, h) => a + h[1], 0) / span;
  const txt = '<b>戰鬥數據</b>　每隻 ' + per + (n && n <= 20 ? '（' + n + ' 隻）' : '（最近 20 隻）') + '<br>每分鐘受傷 ' + Math.round(taken * 100) + '% 血量・每秒傷害 ' + fmt(dps) + '・重傷 ' + (st.stats.deaths - DEV.d0) +

    case 'fateGive': { const k = devVal('dvFK'), s = devNum('dvFS', 1, 5); if (!GAME.fate.list[k] || s == null) return; st.fate.open = true; fateAdd(st, k, GAME.fate.value[s]); msg = '給了 ☆' + s + ' ' + GAME.fate.list[k].name; keep = true; break; }

    case 'fateSet': { st.fate.open = true; const s = devNum('dvFS', 1, 5); if (s == null) return; const set = fateSet(st), n = fateSlots(st); for (let i = 0; i < 5; i++) set[i] = null; GAME.fate.botPrefer.slice(0, n).forEach((k, i) => { const it = fateAdd(st, k, GAME.fate.value[s]); set[i] = it.id; }); msg = '放上一組常用的 ☆' + s + '（' + n + ' 格）'; break; }
    case 'fateFree': st.fate.free = (st.fate.free || 0) + 100; msg = '免費尋命 +100 次'; keep = true; break;
    case 'fateDust': st.fate.dust += 1000; msg = '命塵 +1000'; keep = true; break;
    case 'fateClear': st.fate.bag = []; st.fate.sets = newFate().sets; msg = '命匣清空'; break;
    case 'merit': { const n = devNum('dvMerit', 0, 999999); if (n == null) return; st.merit = n; msg = '功績設為 ' + fmt(n) + '（' + rankName(rankOf(st)) + '）'; break; }
    case 'silver': { const n = devNum('dvSilver', 0, 999999999); if (n == null) return; st.silver = n; msg = '銀兩設為 ' + fmt(n); keep = true; break; }

    case 'ultLv': { const n = devNum('dvUltLv', 1, GAME.ult.maxLv); if (n != null) { st.ultLv[st.weapon] = n; msg = GAME.ult.name + ' Lv.' + n; } break; }
    case 'ultFull': st.ultCharge = GAME.ult.max; msg = '天御已集滿'; keep = true; break;
    case 'ultZero': st.ultCharge = 0; msg = '天御歸零'; keep = true; break;
    case 'zone': {

      if (rt.tower) { towerEnd(st, rt, 'leave'); rt.events.length = 0; }
      for (const x of GAME.zones) if (x.idx < z.idx) st.explore[x.id] = Math.max(st.explore[x.id] || 0, x.need); // 前面的區域都算探索完，才不會被擋
      st.zone = z.id; st.auto = false; msg = '前往' + z.place + '・' + z.name + '（已關閉自動前進）'; break;
    }
    case 'main': {
      const c = devNum('dvMain', 0, GAME.mains.length - 1); if (c == null) return;
      st.main = { ch: c, step: 0, base: 0, surv: 0, gated: false, done: false }; mainBegin(st);
      for (const x of GAME.zones) if (devChIdx(x) < c) st.explore[x.id] = Math.max(st.explore[x.id] || 0, x.need);
      msg = '主線跳到' + GAME.mains[c].chapter + '開頭'; keep = true; break;
    }
    case 'tower': {
      const id = devVal('dvTower'), n = devNum('dvFloor', 0, 999); if (!towerById(id) || n == null) return;
      st.towers[id] = n; msg = towerById(id).name + '設為 ' + n + ' 層'; keep = true; break;
    }
    case 'explore': for (const x of GAME.zones) st.explore[x.id] = x.need; msg = '全部區域探索完成'; keep = true; break;
    case 'autoMove': st.auto = !st.auto; msg = st.auto ? '已打開自動前進' : '已關閉自動前進'; keep = true; break;
    case 'spawn': {
      const key = devVal('dvRare'); if (!GAME.monsters[key]) return;
      if (rt.tower) { toast('在塔裡不能叫出魔物'); return; }
      $('#modal').classList.add('hidden');

      if (rt.mode === 'down') st.hp = rt.d.maxHp;
      rt.force = key; rt.mob = null; rt.mobs = []; rt.mode = 'search'; rt.wait = 0.3; resetArena();
      addLog('<span class="k-lv">測試：叫出' + GAME.monsters[key].name + '</span>'); renderLog(); save(); return;
    }
    case 'hp': { const p = Number(devVal('dvHp')) || 1; st.hp = Math.max(1, Math.round(rt.d.maxHp * p)); msg = '血量設為 ' + Math.round(p * 100) + '%'; $('#modal').classList.add('hidden'); save(); renderAll(); toast(msg); return; }
    case 'revive': if (rt.mode === 'down' || rt.mode === 'rest') { st.hp = rt.d.maxHp; rt.mode = 'search'; rt.wait = GAME.rules.searchSec; msg = '重傷已恢復'; } else msg = '目前沒有重傷'; keep = true; break;
    case 'offline': {
      const hrs = Number(devVal('dvOff')) || 1, secs = Math.min(hrs * 3600, GAME.rules.offlineCapSec);
      $('#modal').classList.add('hidden');
      st.stats.offlineSec += secs; const { sum } = simulate(st, secs, rt); rt.events.length = 0; resetArena(); devHudReset();
      save(); renderAll(); showReport(sum, secs); return;
    }
    default: return;
  }
  devRefresh(keep);
  if (msg) { addLog('<span class="k-lv">測試：' + msg + '</span>'); renderLog(); toast(msg); }
  devOpen(true);
}


/* ---------- v0.19.3 聲音：音效（Web Audio 即時合成，不用音檔）＋背景音樂（阿布的曲子，放在 music/） ----------
   音量設定存在 localStorage 'yujian-audio'：每台裝置自己的，不跟存檔走、不上雲端。
   瀏覽器規定要先點一下畫面才能出聲（audUnlock）；切到背景就整個暫停。
   這個檔案由 build.py 塞進 template.html 的 AUDIO 標記處，跟 engine.js、scene.js、dev.js 共用同一段 script */
const AUD_KEY = 'yujian-audio';
const AUD = { ctx: null, sfx: null, mus: null, last: {}, n: 0, nAt: 0, p: null, tickAt: 0, bgm: { cur: null, want: null, since: 0, els: {} } };
const AUD_NOISE = new WeakMap(), AUD_KS = new WeakMap();
const AUD_BOOST = 1.6; // 限幅器不太會自己補增益，整體補回約 +4 dB

function audPrefs() {
  if (!AUD.p) { let o = {}; try { o = JSON.parse(localStorage.getItem(AUD_KEY)) || {}; } catch (e) {} AUD.p = Object.assign({ music: true, sfx: true, mv: 0.5, sv: 0.7 }, o); }
  return AUD.p;
}
function audSetPref(k, v) { audPrefs()[k] = v; try { localStorage.setItem(AUD_KEY, JSON.stringify(AUD.p)); } catch (e) {} audApply(); }
function audApply() {
  if (!AUD.ctx) return;
  const p = audPrefs(), t = AUD.ctx.currentTime;
  AUD.sfx.gain.setTargetAtTime(p.sfx ? p.sv * AUD_BOOST : 0, t, 0.05);
  AUD.mus.gain.setTargetAtTime(p.music ? p.mv * 0.8 : 0, t, 0.3);
  bgmUpdate(true);
}
// 只在太大聲時才壓（接近限幅器）：門檻 −6 dB；瀏覽器會自動補一點增益，門檻低的話小聲的會被放大、聲音的突波會冒出來

function audInit() {
  if (AUD.ctx) return AUD.ctx;

  try { AUD.ctx = new AC(); } catch (e) { return null; }
  const c = AUD.ctx, comp = c.createDynamicsCompressor();
  audLimiter(comp);
  AUD.sfx = c.createGain(); AUD.sfx.gain.value = 0; AUD.sfx.connect(comp); comp.connect(c.destination);
  AUD.mus = c.createGain(); AUD.mus.gain.value = 0; AUD.mus.connect(c.destination);
  audApply();
  return c;
}
function audUnlock() { const c = audInit(); if (c && c.state !== 'running' && !document.hidden) c.resume().then(() => bgmUpdate(true)).catch(() => {}); else bgmUpdate(true); }
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, audUnlock, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (!AUD.ctx) return;
  if (document.hidden) { AUD.ctx.suspend().catch(() => {}); bgmPauseAll(); }
  else AUD.ctx.resume().then(() => bgmUpdate(true)).catch(() => {});
});

/* ---- 合成用的小工具：c＝AudioContext（或 OfflineAudioContext），o＝接到哪裡，t＝開始時間 ---- */
const PN = { G2: 98, D3: 146.83, G3: 196, G4: 392, A4: 440, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, D6: 1174.66, E6: 1318.51, G6: 1567.98, A6: 1760, C7: 2093, E7: 2637 };
function sNoise(c) {
  let b = AUD_NOISE.get(c);
  if (!b) { b = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AUD_NOISE.set(c, b); }
  return b;
}
// 音量：a 秒內升到 v，再用 d 秒淡掉
function sEnv(c, t, a, d, v) { const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(v, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); return g; }
function sTone(c, o, t, { type = 'sine', f = 440, f2 = 0, a = 0.004, d = 0.2, v = 0.3, det = 0 }) {

  const g = sEnv(c, t, a, d, v); s.connect(fl); fl.connect(g); g.connect(o); s.start(t, Math.random() * 0.5); s.stop(t + a + d + 0.05);

// 鐘、磬：幾個不成整數倍的泛音
function sBell(c, o, t, f, d = 0.8, v = 0.2) { [[1, 1], [2, 0.45], [2.76, 0.3], [5.4, 0.12]].forEach(([r, k], i) => sTone(c, o, t, { f: f * r, a: 0.002, d: d / (1 + i * 0.6), v: v * k })); }
// 撥弦（琴、弓）：Karplus-Strong，算好的波形照頻率存起來重複用
function sPluck(c, o, t, f, d = 0.5, v = 0.3) {

    for (let i = 0, k = 0; i < n; i++) { const nk = (k + 1) % p; x[i] = ring[k]; ring[k] = 0.996 * 0.5 * (ring[k] + ring[nk]); k = nk; }
    for (let i = 0; i < 64 && i < n; i++) x[n - 1 - i] *= i / 64; // 尾巴淡掉，避免喀一聲
    cache[key] = b;

/* ---------- 主迴圈 ---------- */
function tick() {
  const now = Date.now();
  let dt = (now - lastWall) / 1000; lastWall = now;
  if (dt > 3) { // 分頁在背景被暫停過：用同一套規則快轉
    const secs = Math.min(dt, GAME.rules.offlineCapSec);
    st.stats.offlineSec += secs;
    const { sum } = simulate(st, secs, rt);
    if (dt > 60) showReport(sum, dt);
    resetArena(); acc = 0; devTick(0, true);
  } else {
    acc += dt; st.stats.playSec += dt; devTick(dt); audTick();
    while (acc >= 0.1) { step(st, rt, 0.1); acc -= 0.1; }
  }
  if (rt.events.length) { for (const e of rt.events) handle(e); rt.events.length = 0; renderLog(); }
  renderHero(); renderArena(); renderMain(); renderUlt(); renderBars(); renderSide(); sceneWake();
  const ae = document.activeElement, typing = ae && (['SELECT', 'TEXTAREA'].includes(ae.tagName) || (ae.tagName === 'INPUT' && ['range', 'number', 'text'].includes(ae.type)));
  if (panelDirty && Date.now() - lastPanelAt > 400 && !typing) { renderTabs(); renderPanel(); }
  if (now - lastSaveAt > 5000) save();
  if (cloud.user && !cloud.busy && !cloud.hold && now - cloud.last > CLOUD_EVERY) cloudSync('auto');
}

function start() {
  const loaded = load();
  st = loaded || freshState();
  viewChap = curChap(); cxChap = viewChap;
  rt = newRuntime(st);
  if (loaded) {
    const away = (Date.now() - st.lastSave) / 1000;
    if (away > 30) {
      const secs = Math.min(away, GAME.rules.offlineCapSec);
      st.stats.offlineSec += secs;
      const { sum } = simulate(st, secs, rt);
      showReport(sum, away);
    }
  } else {
    addLog(GAME.npcs.quest.name + '：首區最近不太平，城外到處都有魔物越界，麻煩你了。');
  }
  if (st.yuxinBack) { const B = st.yuxinBack; delete st.yuxinBack; addLog('<span class="k-gold">御心改成「部位強化」和「命格」：練過的御心全部退還，銀兩 +' + fmt(B.silver) + '、精魄 +' + fmt(B.mats['精魄'] || 0) + '，突破材料也一起退回。到「裝備」→「強化」重新分配。</span>'); setTimeout(() => toast('御心的花費已全部退還'), 1200); }
  if (st.skillBack) { const B = st.skillBack; delete st.skillBack; addLog('<span class="k-gold">招式等級改制：所有招式退回 Lv.1（Lv.1 的數值約等於舊版 Lv.4），升級花掉的銀兩 +' + fmt(B.silver) + '、精魄 +' + fmt(B.mats['精魄'] || 0) + '，各區材料也一起退回。柳區（Lv.' + GAME.mastery.needLv[2] + '）以後能升到 Lv.2。天御也改成集氣，倍率大幅提高。</span>'); setTimeout(() => toast('招式升級的花費已全部退還'), 1600); }
  if (st.forgeNew) { delete st.forgeNew; addLog('<span class="k-gold">部位強化改版：兵器每次 +22 攻擊、衣甲每次 +80 血量（護腕、佩飾原本的攻擊，頭冠、靴履、佩飾原本的血量併過去，扣掉一點換成詞條）；護腕、頭冠、靴履、佩飾改成每次隨機骰一條詞條，已經照你目前的強化次數補骰好了。</span>'); }
  if (st.rankBack) { const B = st.rankBack; delete st.rankBack; addLog('<span class="k-gold">位階重排：功績改成只算事蹟（主線、第一次擊倒的精英首領、探索完的地方、圖鑑、懸賞、守塔者），照你的紀錄重算是 ' + fmt(B.to) + '，目前' + B.name + '。' + (B.exam ? '功績已經夠升白銀，到城鎮的「委託」接下晉階考核。' : '') + '</span>'); }
  if (st.lvBack) { const B = st.lvBack; delete st.lvBack; addLog('<span class="k-gold">等級重新換算：累積的經驗一點都沒少，Lv.' + B.from + ' 換算成 Lv.' + B.to + '（新的 1 級約等於原本的 2 級多，魔物、地圖的等級也一起換算）。' + (B.pts ? '加點已經照星數重新分配，每把武器都可以免費重新分配一次。' : '') + '</span>'); setTimeout(() => toast('等級換算：Lv.' + B.from + ' → Lv.' + B.to), 1400); }
  if (st.ptsReset) { delete st.ptsReset; addLog('<span class="k-gold">加點改成每點 +1：原本加過點的武器已照星數比例重新分配，每把武器都可以免費重新分配一次。</span>'); }
  devHudReset(); devChrome(); changelogBadge();
  if (DEV.on) addLog('<span class="k-lv">測試模式中：這份存檔不會同步雲端</span>');
  save(); sceneApply(); renderAll();
  if (!loaded) showStep('<div class="sub" style="margin-bottom:6px">仙曆五百餘年，天霖國・首區</div>');
  if (cloud.ok && cloudMeta().on) cloudBoot();
  lastWall = Date.now();
  setInterval(tick, 100);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); cloud.hiddenAt = Date.now(); if (cloud.user && !cloud.hold) cloudSync('auto'); }
    else if (cloud.user && cloud.hiddenAt && Date.now() - cloud.hiddenAt > 60000) cloudSync('resume'); // 回來時看看別台有沒有更新
    if (!document.hidden) { if (typeof SC !== 'undefined' && SC.hiddenAt && Date.now() - SC.hiddenAt > 5000) sceneRefreshArt(); sceneWake(); }
    else if (typeof SC !== 'undefined') SC.hiddenAt = Date.now();
  });
  window.addEventListener('pagehide', save);
}
start();
</script>
</body>
</html>
